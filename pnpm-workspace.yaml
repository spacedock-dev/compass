# Only the root package is a workspace member. pnpm 12 owns these settings here.
engineStrict: true
pmOnFail: error
runtimeOnFail: error
strictPeerDependencies: true
autoInstallPeers: false
saveExact: true
frozenLockfile: true
verifyStoreIntegrity: true
strictStorePkgContentCheck: true
strictSsl: true
verifyDepsBeforeRun: error
# Install scripts have no approvals. Explicit project run commands remain available.
ignoreScripts: true
strictDepBuilds: true
allowBuilds: {}
dangerouslyAllowAllBuilds: false
sideEffectsCache: false
# Floors for transitive devDependencies with published advisories (undici via jsdom and vitest,
# glob via the Storybook docgen plugin). Raise or drop them once the parents ship patched ranges.
overrides:
  undici: ">=8.12.2 <9"
  glob: ">=14.0.2 <15"
  minimatch: ">=11.0.1 <12"
