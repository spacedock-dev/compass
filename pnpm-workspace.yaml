# Only the root package is a workspace member. pnpm 12 owns these settings here.
engineStrict: true
pmOnFail: error
runtimeOnFail: error
strictPeerDependencies: true
autoInstallPeers: false
saveExact: true
frozenLockfile: true
verifyStoreIntegrity: true
strictStorePkgContentCheck: true
strictSsl: true
verifyDepsBeforeRun: error
# Install scripts have no approvals. Explicit project run commands remain available.
ignoreScripts: true
strictDepBuilds: true
allowBuilds: {}
dangerouslyAllowAllBuilds: false
sideEffectsCache: false
# Patched transitive devDependencies with published advisories: glob via the Storybook docgen
# plugin, whose own range (^13) has no patched release. Exact, and at least two weeks old when
# chosen, as the direct pins are (docs/design-shadcn-adoption.md, "Component stories"). Drop it
# once its parent's own range resolves to a patched release, as undici (through jsdom 31's
# ^8.12.3) and minimatch (through glob 14.0.4's ^11.0.5) were.
overrides:
  glob: "14.0.4"
