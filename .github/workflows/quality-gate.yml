name: Quality Gate

# Strict lint (ruff, all rules), formatting, mypy --strict, the frontend's own
# checks (Biome, strict types, unit tests and the build; the UI is verified by Storybook),
# and both the Python and the frontend suites under coverage with enforced thresholds. The
# final `quality-gate` job aggregates every result into the one status that
# branch protection requires.
#
# Adapted from DataRecce/recce-cloud-infra `server-unittest.yaml` (lint/type/
# test job shape) and `coverage-report.yaml` (sticky PR coverage comment, gate
# job, `coverage-exception` label escape hatch), simplified for a
# single-component repository: everything runs in one workflow, so no
# workflow_run indirection or artifact cross-downloads are needed.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect what the gate can measure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      # actions/checkout@v7.0.1 — pinned to immutable SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the measurable jobs need to run
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # FAILS OPEN, deliberately. Anything this cannot compute runs the full
          # gate. A wrong "false" skips measurable jobs that could catch a
          # regression; a wrong "true" costs runners. Those are not
          # symmetric, so every unknown resolves to true.
          emit() { echo "code=$1" >> "$GITHUB_OUTPUT"; echo "code=$1"; exit 0; }

          [ "$EVENT" = "pull_request" ] || emit true

          BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)
          [ -n "$BASE" ] || emit true

          FILES=$(git diff --name-only "$BASE" "$HEAD_SHA" 2>/dev/null || true)
          [ -n "$FILES" ] || emit true

          # Effective deny list, from the sources below. The literal scan is not
          # dependency analysis, so review new reads (and the root allowlist) by
          # hand. validate.yml's unfiltered suite remains the backstop.
          # 1. Whole double-quoted docs paths in the tests.
          ASSERTED=$(grep -rhoE '"docs/[^"]+\.md"' compass/skills/compass/tests/*.py \
                     | tr -d '"' | sort -u || true)
          # 2. DocumentedCaptureFiguresTest builds this path from CAPTURES.
          ASSERTED=$(printf '%s\n' "$ASSERTED" 'docs/captures/README.md' | sort -u)
          # 3. Every document the decision-citation checker resolves a heading
          # anchor in. Derived from the runtime's own citation links rather than
          # listed, because that IS the checker's dependency set: it reads each
          # linked target and requires the exact fragment to exist, so renaming
          # a heading in any of them turns test_documentation red. Nine such
          # documents were reachable and absent from this list when the checker
          # landed, which is DRC-4462's defect one layer up, so deriving it is
          # the only form that cannot go stale as citations move.
          CITED=$(grep -rhoE '\(docs/[^)]+\.md#' \
                    compass/skills/compass/compass_runtime/ 2>/dev/null \
                  | sed 's/^(//; s/#$//' | sort -u || true)
          ASSERTED=$(printf '%s\n%s\n' "$ASSERTED" "$CITED" | grep . | sort -u)
          # Frontend/script tests can also read docs, including root prose.
          # This remains a literal scan, not dependency analysis: composed
          # paths still need an explicit reviewed exception like captures above.
          DOC_PYTHON=$(command -v python || command -v python3 || true)
          [ -n "$DOC_PYTHON" ] || emit true
          FRONTEND_ASSERTED=$("$DOC_PYTHON" - <<'PY'
          import pathlib
          import re

          quotes = chr(34) + chr(39)
          literal = re.compile("[" + quotes + r"]((?:docs/[^" + quotes + r"\r\n]+|[\w.-]+)\.md)[" + quotes + "]")
          citation = re.compile(r"\((docs/[^)]+\.md)#")
          found = set()
          for root in (pathlib.Path("frontend"), pathlib.Path("scripts/tests")):
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if path.is_file() and path.suffix in {".py", ".ts", ".tsx", ".js", ".jsx", ".mts", ".mjs"}:
                      source = path.read_text(encoding="utf-8")
                      found.update(literal.findall(source))
                      found.update(citation.findall(source))
          print("\n".join(sorted(found)))
          PY
          ) || emit true
          ASSERTED=$(printf '%s\n%s\n' "$ASSERTED" "$FRONTEND_ASSERTED" | grep . | sort -u)
          printf 'Effective docs deny list:\n%s\n' "$ASSERTED"

          # `case` globs match `/`, unlike pathname expansion, so `docs/*.md`
          # already covers `docs/plans/x.md` at any depth — a second
          # `docs/*/*.md` alternative is dead and actionlint (SC2222) says so.
          #
          # Prose that no test reads and no linter parses. Three root documents
          # are NOT here, because tests/test_documentation.py opens all three by
          # literal path: SKILL.md (its store paths against
          # config.resolve_store_roots), SECURITY.md (whole sections pinned
          # sentence by sentence, as the contract the code must still meet), and
          # README.md (one clause read off the file to keep it agreeing with
          # SECURITY.md's scope count). Listing any of them here wrongly skips
          # the measurable jobs; validate.yml still runs that module unfiltered.
          is_prose() {
            # Check measured dependencies before any prose allowlist, including
            # root docs a frontend setup test actually reads.
            while IFS= read -r asserted; do
              [ -n "$asserted" ] || continue
              [ "$1" = "$asserted" ] && return 1
            done <<< "$ASSERTED"
            case "$1" in
              HOW_TO_USE.md|AGENTS.md|CLAUDE.md|CONTRIBUTING.md) return 0 ;;
              COMPATIBILITY.md|CODE_OF_CONDUCT.md) return 0 ;;
              .github/PULL_REQUEST_TEMPLATE.md|.github/ISSUE_TEMPLATE/*) return 0 ;;
              # Frontend/release build wiring is measured by the required gate.
              # Unrelated workflow prose retains its existing short path.
              .github/workflows/quality-gate.yml|.github/workflows/release.yml) return 1 ;;
              .github/workflows/release.yaml) return 1 ;;
              .github/workflows/frontend*.yml|.github/workflows/frontend*.yaml) return 1 ;;
              .github/workflows/*) return 0 ;;
              docs/*.md)
                return 0 ;;
              *) return 1 ;;
            esac
          }

          while IFS= read -r f; do
            [ -n "$f" ] || continue
            is_prose "$f" || emit true
          done <<< "$FILES"

          echo "Every changed path is prose the gate cannot measure."
          emit false

  # The job keeps the name it had when it also ran the embedded-source linter, because a
  # branch ruleset may require that exact context; the frontend's sources are linted by the
  # `frontend` job (`pnpm lint`).
  lint:
    name: Lint (ruff + format + frontend sources)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout@v7.0.1 — pinned to immutable SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python@v7.0.0 — pinned to immutable SHA.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install toolchain
        run: python3 -m pip install -r requirements-dev.txt -r requirements-validation.txt
      - name: Ruff lint (select = ALL)
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .

  typecheck:
    name: Type check (mypy --strict)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install toolchain
        run: python3 -m pip install -r requirements-dev.txt -r requirements-validation.txt
      - name: Mypy (strict)
        run: mypy

  runtime-floor:
    name: Runtime floor (Python 3.11)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          # Validation requirements only. This job stopped running the suite
          # under `coverage`, and the rest of requirements-dev.txt is ruff and
          # mypy, which run on 3.12 in their own jobs. PyYAML is still needed:
          # scripts.tests.test_validate_plugins imports the validator.
          cache-dependency-path: requirements-validation.txt
      - name: Install validation requirements
        run: python -m pip install -r requirements-validation.txt
      - name: Direct-launch smoke on the supported floor
        run: |
          cd "${RUNNER_TEMP}"
          python "${GITHUB_WORKSPACE}/compass/skills/compass/server.py" --help
          python "${GITHUB_WORKSPACE}/compass/skills/compass/server.py" --diagnose --json
      # Plain unittest, not `coverage run`. The threshold is owned by the `test`
      # job below and is enforced there once; a second `coverage report` on a
      # second interpreter measured nothing new, because nothing in the product
      # branches on `sys.version_info`, and it pre-empted that job's
      # `coverage-exception` bypass. What this job is for is the floor itself:
      # does the shipped code import, launch and pass on 3.11.
      #
      # Through scripts/run_tests.py, which is stdlib-only for exactly this job:
      # it installs requirements-validation.txt and nothing else. Same discovery,
      # fixtures and verdict as `unittest discover`, spread over the runner's
      # cores (131s serial against 34s on four workers, measured 2026-09-23).
      - name: Run the full suite on the floor
        run: |
          python scripts/run_tests.py --slowest 10 -s compass/skills/compass/tests -t .
          python scripts/run_tests.py -s scripts/tests -t scripts/tests

  test:
    name: Tests + coverage threshold
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # sticky coverage comment (same-repo PRs only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install toolchain
        run: python3 -m pip install -r requirements-dev.txt -r requirements-validation.txt

      # Each worker records its own data file and `combine` merges them, which
      # measured the same 86.8% as the serial `coverage run` (2026-09-23).
      # `COVERAGE_CORE=sysmon` would cut the tracing cost, but coverage refuses
      # it with `branch = true` below Python 3.14 and falls back to ctrace.
      - name: Run full unittest suite under coverage
        run: |
          coverage erase
          python3 scripts/run_tests.py --coverage --slowest 10 -s compass/skills/compass/tests -t .
          python3 scripts/run_tests.py --coverage -s scripts/tests -t scripts/tests
          coverage combine

      # No `coverage report` here. It reads `fail_under` from pyproject and
      # exits non-zero, and it ran BEFORE the label check below, so a PR
      # carrying `coverage-exception` failed at this line and never reached the
      # bypass. The threshold is enforced once, in the exception-aware step.
      #
      # The threshold lives in pyproject.toml ([tool.coverage.report]
      # fail_under) so local runs enforce the same gate. A PR labeled
      # `coverage-exception` may merge below threshold — label use is
      # deliberately visible in the PR timeline.
      - name: Check coverage-exception label
        id: exception
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HAS=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --json labels --jq '[.labels[].name] | map(select(. == "coverage-exception")) | length')
          echo "has_exception=${HAS:-0}" >> "$GITHUB_OUTPUT"
          if [ "${HAS:-0}" != "0" ]; then
            echo "::warning::coverage-exception label present — threshold will not block"
          fi

      - name: Coverage report and threshold
        run: |
          coverage json -o coverage.json
          {
            echo "## Coverage"
            echo '```'
            coverage report --fail-under=0
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.exception.outputs.has_exception || '0' }}" != "0" ]; then
            echo "Threshold skipped (coverage-exception label)."
            coverage report --fail-under=0 > coverage-report.txt
          else
            coverage report > coverage-report.txt
          fi
          cat coverage-report.txt

      - name: Upload coverage artifact
        # actions/upload-artifact@v7 — pinned to immutable SHA.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.json
          retention-days: 7

      - name: Build coverage comment body
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          {
            echo "<!-- coverage-marker -->"
            echo "### Coverage"
            echo ""
            echo '```text'
            cat coverage-report.txt
            echo '```'
            echo ""
            echo "_Threshold: \`fail_under\` in pyproject.toml · label \`coverage-exception\` to bypass (visible in PR timeline)._"
          } > coverage-comment.md

      # Sticky comment: find-and-update rather than spam. Same-repo PRs only —
      # fork PRs get a read-only token, and the gate itself never depends on
      # the comment.
      - name: Find existing coverage comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: find-comment
        continue-on-error: true
        # peter-evans/find-comment@v4 — pinned to immutable SHA.
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: "<!-- coverage-marker -->"

      - name: Post coverage comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        # peter-evans/create-or-update-comment@v5 — pinned to immutable SHA.
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body-path: coverage-comment.md
          edit-mode: replace

  # Coverage and its sticky comment stay Ubuntu-only; this job checks native
  # macOS behavior without repeating the Ubuntu suite from `test` and
  # `runtime-floor`. Windows CI was retired after the frontend refactor.
  platform-tests:
    name: Tests (${{ matrix.os }}, ${{ matrix.suite }} ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false # one platform failing must not hide the others
      matrix:
        os: [macos-latest]
        suite: [dashboard, scripts]
        # Keep the measured script shards so the campaign tests and release
        # rehearsals do not hold the dashboard leg.
        shard: [1, 2, 3]
        exclude:
          - suite: dashboard
            shard: 2
          - suite: dashboard
            shard: 3
    steps:
      # actions/checkout@v7.0.1 — pinned to immutable SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python@v7.0.0 — pinned to immutable SHA.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      # The dashboard server itself is stdlib-only, but the repository
      # validator that scripts/tests/test_validate_plugins.py imports needs
      # PyYAML. The lint/type tooling in requirements-dev.txt is not needed
      # here — this job only runs unittest.
      - name: Install validation requirements
        run: python -m pip install -r requirements-validation.txt
      - name: Show interpreter
        run: python -c "import sys, os; print(sys.version, os.name, sys.platform)"
      - name: Confirm sqlite3 is present on this runner
        run: python -c "import sqlite3; print(sqlite3.sqlite_version)"
      - name: Run dashboard test discovery
        if: matrix.suite == 'dashboard'
        run: python scripts/run_tests.py --slowest 10 -s compass/skills/compass/tests -t .
      - name: Run script unit tests
        if: matrix.suite == 'scripts'
        run: python scripts/run_tests.py --slowest 10 --shard ${{ matrix.shard }}/3 -s scripts/tests -t scripts/tests

  frontend:
    name: Frontend (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    # The browser proofs are no longer part of the gate (owner, 2026-10-12): the UI is verified by the
    # `storybook` job below. Their scripts stay in package.json and run on demand.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      # actions/setup-node@v7.0.0 — exact verified release commit.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          check-latest: false
          package-manager-cache: false
      # pnpm/setup@v3.0.0 verifies its native pnpm download's signature/checksum.
      # Keep Node authoritative above, and run the script-denied install explicitly.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 12.9.1
          install: false
          node-version-file: false
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: python
        with:
          python-version: "3.11"
      - name: Verify effective builder versions
        timeout-minutes: 1
        run: node -e "const fs=require('node:fs');const wanted=fs.readFileSync('.node-version','utf8').trim();if(process.versions.node!==wanted)throw Error('Unexpected Node '+process.versions.node);console.log('Node '+process.versions.node)"
      - name: Frozen install with dependency scripts denied
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Frontend lint
        timeout-minutes: 2
        run: pnpm lint
      - name: Strict frontend types
        timeout-minutes: 2
        run: pnpm typecheck
      - name: Hand-written CSS ratchet against the actual PR base
        if: github.event_name == 'pull_request'
        timeout-minutes: 1
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm test:styles
      - name: Frontend behavioral unit tests
        # 6 minutes timed out on a suite whose every test had passed: the macOS runner took 5m16s on the
        # commit before (2026-10-28). release.yml's copy of this step is held to the same limit.
        timeout-minutes: 10
        run: pnpm test
      - name: Owned development lifecycle and isolation tests
        timeout-minutes: 3
        env:
          COMPASS_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: pnpm test:dev
      - name: Clean native preview build (not the shipping artifact)
        timeout-minutes: 3
        run: pnpm build:preview

  # The frontend's coverage threshold, held the way the Python one is in `test` above. The thresholds live in
  # vitest.config.mts so `pnpm test:coverage` enforces the same gate locally, and a PR labeled
  # `coverage-exception` may merge below them. Ubuntu only, as the Python coverage is; the macOS `frontend` job
  # still runs the suite natively. The token here stays read-only, because this job runs the frontend's
  # third-party test dependencies: the sticky comment is posted by `frontend-coverage-comment`, which runs none.
  frontend-coverage:
    name: Frontend tests + coverage threshold
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read # the coverage-exception label check, before any dependency is installed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node@v7.0.0 — exact verified release commit.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          check-latest: false
          package-manager-cache: false
      # pnpm/setup@v3.0.0 verifies its native pnpm download's signature/checksum.
      # Keep Node authoritative above, and run the script-denied install explicitly.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 12.9.1
          install: false
          node-version-file: false
          cache: false
      - name: Check coverage-exception label
        id: exception
        if: github.event_name == 'pull_request'
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          HAS=$(gh pr view "$PR" --repo "$REPO" \
            --json labels --jq '[.labels[].name] | map(select(. == "coverage-exception")) | length')
          echo "has_exception=${HAS:-0}" >> "$GITHUB_OUTPUT"
          if [ "${HAS:-0}" != "0" ]; then
            echo "::warning::coverage-exception label present — threshold will not block"
          fi
      - name: Verify effective builder versions
        timeout-minutes: 1
        run: node -e "const fs=require('node:fs');const wanted=fs.readFileSync('.node-version','utf8').trim();if(process.versions.node!==wanted)throw Error('Unexpected Node '+process.versions.node);console.log('Node '+process.versions.node)"
      - name: Frozen install with dependency scripts denied
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Tests and the threshold in one run: Vitest checks the thresholds after the suite, and a failing test
      # fails the step with or without the label.
      - name: Frontend suite under coverage, and the threshold
        timeout-minutes: 10
        env:
          EXCEPTION: ${{ steps.exception.outputs.has_exception || '0' }}
        run: |
          set -euo pipefail
          if [ "$EXCEPTION" != "0" ]; then
            echo "Threshold skipped (coverage-exception label)."
            pnpm test:coverage --coverage.thresholds.statements=0 --coverage.thresholds.branches=0 \
              --coverage.thresholds.functions=0 --coverage.thresholds.lines=0
          else
            pnpm test:coverage
          fi
      - name: Coverage summary
        if: always()
        timeout-minutes: 1
        run: |
          set -euo pipefail
          SUMMARY=coverage/frontend/coverage-summary.json
          if [ ! -f "$SUMMARY" ]; then
            echo "No coverage summary was written."
            exit 0
          fi
          node - "$SUMMARY" <<'JS'
          const fs = require('node:fs');
          const total = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')).total;
          const rows = ['statements', 'branches', 'functions', 'lines'].map(
            (k) => `| ${k} | ${total[k].pct.toFixed(2)}% | ${total[k].covered} / ${total[k].total} |`,
          );
          const footer =
            '_Thresholds: `coverage.thresholds` in vitest.config.mts · label `coverage-exception` to bypass ' +
            '(visible in PR timeline)._';
          const lines = ['<!-- frontend-coverage-marker -->', '### Frontend coverage', ''];
          lines.push('| Metric | Covered | Count |', '|---|---|---|', ...rows, '', footer, '');
          fs.writeFileSync('coverage/frontend/comment.md', lines.join('\n'));
          JS
          cat coverage/frontend/comment.md >> "$GITHUB_STEP_SUMMARY"
          cat coverage/frontend/comment.md
      - name: Upload frontend coverage artifact
        if: always()
        # actions/upload-artifact@v7 — pinned to immutable SHA.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontend-coverage-${{ github.run_id }}
          path: |
            coverage/frontend/coverage-summary.json
            coverage/frontend/comment.md
          if-no-files-found: ignore
          retention-days: 7

  # Posts the summary `frontend-coverage` wrote. A separate job so the write token never shares a job with
  # third-party package code; it checks out nothing and runs only the two pinned comment actions. Like the
  # Python comment, it never gates: the threshold is enforced in `frontend-coverage`.
  frontend-coverage-comment:
    name: Frontend coverage comment
    needs: frontend-coverage
    if: >-
      always() && needs.frontend-coverage.result != 'skipped' && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # sticky coverage comment (same-repo PRs only)
    steps:
      - name: Fetch the coverage summary
        id: fetch
        continue-on-error: true
        # actions/download-artifact@v8.0.1, the same pin as release.yml.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: frontend-coverage-${{ github.run_id }}
          path: frontend-coverage
      - name: Find existing frontend coverage comment
        # hashFiles reads only the workspace, which is why the summary is fetched there.
        if: steps.fetch.outcome == 'success' && hashFiles('frontend-coverage/comment.md') != ''
        id: find-comment
        continue-on-error: true
        # peter-evans/find-comment@v4 — pinned to immutable SHA.
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: "<!-- frontend-coverage-marker -->"
      - name: Post frontend coverage comment
        if: steps.find-comment.outcome == 'success'
        continue-on-error: true
        # peter-evans/create-or-update-comment@v5 — pinned to immutable SHA.
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body-path: frontend-coverage/comment.md
          edit-mode: replace

  # The shipped bundle is rebuilt from its sources and compared with the tracked file. Ubuntu only: the bundle is
  # platform-independent bytes, and a stale artifact has been caught here that a local build did not show. The
  # parity proofs that used to run against the bundle are retired from the gate (owner, 2026-10-12).
  frontend-production:
    name: Frontend production bundle (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node@v7.0.0 — exact verified release commit.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          check-latest: false
          package-manager-cache: false
      # pnpm/setup@v3.0.0 verifies its native pnpm download's signature/checksum.
      # Keep Node authoritative above, and run the script-denied install explicitly.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 12.9.1
          install: false
          node-version-file: false
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: python
        with:
          python-version: "3.11"
      - name: Verify effective builder versions
        timeout-minutes: 1
        run: node -e "const fs=require('node:fs');const wanted=fs.readFileSync('.node-version','utf8').trim();if(process.versions.node!==wanted)throw Error('Unexpected Node '+process.versions.node);console.log('Node '+process.versions.node)"
      - name: Frozen install with dependency scripts denied
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Canonical rebuild and tracked artifact comparison
        timeout-minutes: 3
        run: pnpm build:check

  storybook:
    name: Storybook (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          check-latest: false
          package-manager-cache: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 12.9.1
          install: false
          node-version-file: false
          cache: false
      - name: Frozen install with dependency scripts denied
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build offline component stories
        timeout-minutes: 3
        run: pnpm build:storybook
      - name: Install pinned Chromium and its host dependencies
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium
      - name: Component assertions and offline runtime proof
        timeout-minutes: 5
        run: pnpm test:stories

  # The single required status check. Branch protection requires this job, so
  # measurable jobs may skip only when the detector reports code=false.
  quality-gate:
    name: quality-gate
    needs:
      - changes
      - lint
      - typecheck
      - runtime-floor
      - test
      - platform-tests
      - frontend
      - frontend-coverage
      - frontend-production
      - storybook
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all gate jobs succeeded
        env:
          CODE: ${{ needs.changes.outputs.code }}
          R_CHANGES: ${{ needs.changes.result }}
          R_LINT: ${{ needs.lint.result }}
          R_TYPECHECK: ${{ needs.typecheck.result }}
          R_FLOOR: ${{ needs.runtime-floor.result }}
          R_TEST: ${{ needs.test.result }}
          R_PLATFORM: ${{ needs.platform-tests.result }}
          R_FRONTEND: ${{ needs.frontend.result }}
          R_FRONTEND_COVERAGE: ${{ needs.frontend-coverage.result }}
          R_FRONTEND_PRODUCTION: ${{ needs.frontend-production.result }}
          R_STORYBOOK: ${{ needs.storybook.result }}
        run: |
          set -euo pipefail
          echo "changes:        $R_CHANGES (code=$CODE)"
          echo "lint:           $R_LINT"
          echo "typecheck:      $R_TYPECHECK"
          echo "runtime-floor:  $R_FLOOR"
          echo "test:           $R_TEST"
          echo "platform-tests: $R_PLATFORM"
          echo "frontend:       $R_FRONTEND"
          echo "frontend-coverage: $R_FRONTEND_COVERAGE"
          echo "frontend-production: $R_FRONTEND_PRODUCTION"
          echo "storybook:      $R_STORYBOOK"

          # The detector itself is never allowed to skip or fail. If it did, we
          # do not know whether the measurable jobs were skipped on purpose or lost,
          # and "we do not know" must not read as green on a required check.
          if [ "$R_CHANGES" != "success" ]; then
            echo "::error::The change detector did not succeed; refusing to report a gate result."
            exit 1
          fi

          # `skipped` is a pass ONLY when the detector said there was nothing the
          # job could measure. Anything else skipped means a dependency failed
          # upstream and GitHub cascaded it, which is a failure, not a pass.
          for pair in "lint:$R_LINT" "typecheck:$R_TYPECHECK" "runtime-floor:$R_FLOOR" \
                      "test:$R_TEST" "platform-tests:$R_PLATFORM" "frontend:$R_FRONTEND" \
                      "frontend-coverage:$R_FRONTEND_COVERAGE" \
                      "frontend-production:$R_FRONTEND_PRODUCTION" "storybook:$R_STORYBOOK"; do
            job=${pair%%:*}
            res=${pair#*:}
            if [ "$res" = "success" ]; then
              continue
            fi
            if [ "$res" = "skipped" ] && [ "$CODE" = "false" ]; then
              continue
            fi
            echo "::error::$job did not succeed (result=$res, code=$CODE)."
            exit 1
          done

          if [ "$CODE" = "false" ]; then
            echo "Quality gate passed: prose-only change, no measurable job to run."
          else
            echo "Quality gate passed."
          fi
