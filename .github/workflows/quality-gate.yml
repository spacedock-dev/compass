name: Quality Gate

# Strict lint (ruff, all rules), formatting, mypy --strict, the frontend's own
# checks (Biome, strict types, unit tests and the build; the UI is verified by Storybook),
# and both the Python and the frontend suites under coverage with enforced thresholds. The
# final `quality-gate` job aggregates every result into the one status that
# branch protection requires.
#
# Adapted from DataRecce/recce-cloud-infra `server-unittest.yaml` (lint/type/
# test job shape) and `coverage-report.yaml` (sticky PR coverage comment, gate
# job, `coverage-exception` label escape hatch), simplified for a
# single-component repository: everything runs in one workflow, so no
# workflow_run indirection is needed: its jobs hand results to one another as
# artifacts within the run.

# A push to main, the nightly schedule and a manual dispatch run every lane, macOS included, so
# what a pull request's lanes skipped (a fail-open gap, platform drift) surfaces within a day.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  # A merge queue entry. Required checks must report on it or the queue holds the entry forever.
  # Its ref (`gh-readonly-queue/...`) is unique per entry, so the concurrency group below never
  # lets one entry cancel another.
  merge_group:

concurrency:
  # The event is in the group so the nightly run and a push to main never cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Splits the gate into lanes so a change runs only the jobs it can affect:
  # `python` (ruff, mypy, coverage), `lint` (ruff alone, for a Markdown
  # file holding Python blocks the formatter checks), `frontend` (Biome, types, Vitest,
  # the bundle, Storybook), `contract` (the frontend tests that start or read
  # the Python runtime, when the whole frontend lane is not running),
  # `frontend_docs` (only the Vitest files that read a changed document, named in
  # `frontend_docs_tests`), and `python_suites` (the Python suites on Linux, which
  # also read nearly every frontend file). `platform` adds the macOS legs to the
  # python and frontend lanes. scripts/ci_scope.py owns the rules and why; it FAILS
  # OPEN, so anything it cannot compute turns every lane on.
  changes:
    name: Detect what the gate can measure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.detect.outputs.python }}
      lint: ${{ steps.detect.outputs.lint }}
      frontend: ${{ steps.detect.outputs.frontend }}
      contract: ${{ steps.detect.outputs.contract }}
      python_suites: ${{ steps.detect.outputs.python_suites }}
      frontend_docs: ${{ steps.detect.outputs.frontend_docs }}
      frontend_docs_tests: ${{ steps.detect.outputs.frontend_docs_tests }}
      platform: ${{ steps.detect.outputs.platform }}
    steps:
      # actions/checkout@v7.0.1 — pinned to immutable SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide which lanes the change can affect
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          # A pull request is diffed from its base SHA; a merge queue entry from the branch it lands
          # on, so the entries queued ahead of it count too (scripts/ci_scope.py says why).
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -uo pipefail
          # The script fails open on its own; this covers it not running at all.
          if ! python3 scripts/ci_scope.py; then
            echo "::warning::scripts/ci_scope.py failed; running every lane."
            printf 'python=true\nlint=true\nfrontend=true\ncontract=false\npython_suites=true\nfrontend_docs=false\nfrontend_docs_tests=\nplatform=true\n' >> "$GITHUB_OUTPUT"
          fi

  # The job keeps the name it had when it also ran the embedded-source linter, because a
  # branch ruleset may require that exact context; the frontend's sources are linted by the
  # `frontend` job (`pnpm lint`).
  lint:
    name: Lint (ruff + format + frontend sources)
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout@v7.0.1 — pinned to immutable SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python@v7.0.0 — pinned to immutable SHA.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install toolchain
        run: python3 -m pip install -r requirements-dev.txt -r requirements-validation.txt
      - name: Ruff lint (select = ALL)
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .

  typecheck:
    name: Type check (mypy --strict)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install toolchain
        run: python3 -m pip install -r requirements-dev.txt -r requirements-validation.txt
      - name: Mypy (strict)
        run: mypy

  # Parallel legs, one runner each: the dashboard suite, and the script suite in shards. Serial in one
  # job they took 557 s (the dashboard suite 120 s, then the script suite 428 s, 2026-11-02), and the
  # script suite is what set the wall clock. `QualificationRetry` is one class with a class fixture
  # and cannot be split across legs, so the shard count is the one that keeps its shard from being
  # the long pole by much. The job keeps its id, so the aggregator reads one result for all legs:
  # a failed leg fails the job, and a skipped job is a skipped lane.
  runtime-floor:
    name: Runtime floor (Python 3.12, ${{ matrix.suite }} ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.python_suites == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false # a red leg must not hide the others
      matrix:
        suite: [dashboard, scripts]
        shard: [1, 2, 3]
        exclude:
          - suite: dashboard
            shard: 2
          - suite: dashboard
            shard: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          # Validation requirements only. This job stopped running the suite
          # under `coverage`, and the rest of requirements-dev.txt is ruff and
          # mypy, which run on 3.12 in their own jobs. PyYAML is still needed:
          # scripts.tests.test_validate_plugins imports the validator.
          cache-dependency-path: requirements-validation.txt
      - name: Install validation requirements
        run: python -m pip install -r requirements-validation.txt
      # Once, on the dashboard leg: the launch is the same on every leg, so repeating it would
      # only spend three more runners' start-up on the same answer.
      - name: Direct-launch smoke on the supported floor
        if: matrix.suite == 'dashboard'
        run: |
          cd "${RUNNER_TEMP}"
          python "${GITHUB_WORKSPACE}/compass/skills/compass/server.py" --help
          python "${GITHUB_WORKSPACE}/compass/skills/compass/server.py" --diagnose --json
      # Plain unittest, not `coverage run`. The threshold is owned by the `test`
      # job below and is enforced there once; a second `coverage report` on a
      # second interpreter measured nothing new, because nothing in the product
      # branches on `sys.version_info`, and it pre-empted that job's
      # `coverage-exception` bypass. What this job is for is the floor itself:
      # does the shipped code import, launch and pass on 3.12.
      #
      # Through scripts/run_tests.py, which is stdlib-only for exactly this job:
      # it installs requirements-validation.txt and nothing else. Same discovery,
      # fixtures and verdict as `unittest discover`, spread over the runner's
      # cores (the dashboard suite: 131s serial against 34s on four workers,
      # measured 2026-09-23; the script suite is sharded below).
      - name: Run dashboard test discovery on the floor
        if: matrix.suite == 'dashboard'
        run: python scripts/run_tests.py --slowest 10 -s compass/skills/compass/tests -t .
      - name: Run script unit tests on the floor
        if: matrix.suite == 'scripts'
        run: python scripts/run_tests.py --slowest 10 --shard ${{ matrix.shard }}/3 -s scripts/tests -t scripts/tests

  # The coverage run in parallel legs, split as runtime-floor splits the suites. In one job it was the
  # longest in every gate run on 2026-11-06 (574 s on #803: the dashboard suite 166 s, then the script
  # suite 367 s). Each leg uploads its data files and `coverage` below combines them and enforces the
  # threshold once. The job keeps its id, so the aggregator reads one result for every leg.
  test:
    name: Tests under coverage (${{ matrix.suite }} ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false # a red leg must not hide the others
      matrix:
        suite: [dashboard, scripts]
        shard: [1, 2, 3]
        exclude:
          - suite: dashboard
            shard: 2
          - suite: dashboard
            shard: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          # 3.14 for `sysmon` below, which coverage refuses with `branch = true`
          # on any earlier Python. The suites still run on 3.12 in runtime-floor.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install toolchain
        run: python3 -m pip install -r requirements-dev.txt -r requirements-validation.txt

      # Each worker records its own data file and `combine` merges them, which
      # measured the same 86.8% as the serial `coverage run` (2026-09-23).
      # The default tracer cost 30 to 50 times the plain run on loop-heavy tests:
      # one scrub test took 106s under it and 2s under sysmon, and the two suites
      # took 246s and 410s here (2026-10-28).
      - name: Dashboard suite under coverage
        if: matrix.suite == 'dashboard'
        env:
          COVERAGE_CORE: sysmon
        run: python3 scripts/run_tests.py --coverage --slowest 10 -s compass/skills/compass/tests -t .
      - name: Script suite shard under coverage
        if: matrix.suite == 'scripts'
        env:
          COVERAGE_CORE: sysmon
        # Discovery arguments first: test_validate_plugins requires a discovering command in this file
        # with nothing but bare flags before them.
        run: python3 scripts/run_tests.py --coverage -s scripts/tests -t scripts/tests --slowest 10 --shard ${{ matrix.shard }}/3

      # The data files record absolute source paths, which match in `coverage` because every
      # ubuntu-latest checkout lands at the same workspace path.
      - name: Upload this leg's coverage data
        # actions/upload-artifact@v7 — pinned to immutable SHA.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-data-${{ matrix.suite }}-${{ matrix.shard }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  coverage:
    name: Tests + coverage threshold
    needs: [changes, test]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read-only, because this job restores the pip cache and runs the packages it installs: the sticky
    # comment is posted by `coverage-comment`, which does neither.
    permissions:
      contents: read
      pull-requests: read # the coverage-exception label check
    steps:
      # `coverage report` reads the source files, so the tree is checked out where the legs had it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install toolchain
        run: python3 -m pip install -r requirements-dev.txt
      - name: Fetch every leg's coverage data
        # actions/download-artifact@v8.0.1, the same pin as release.yml.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true
      - name: Combine the legs
        run: |
          set -euo pipefail
          ls -a coverage-data
          coverage combine coverage-data

      # No `coverage report` before this. It reads `fail_under` from pyproject and
      # exits non-zero, and when it ran BEFORE the label check below, a PR
      # carrying `coverage-exception` failed there and never reached the
      # bypass. The threshold is enforced once, in the exception-aware step.
      #
      # The threshold lives in pyproject.toml ([tool.coverage.report]
      # fail_under) so local runs enforce the same gate. A PR labeled
      # `coverage-exception` may merge below threshold — label use is
      # deliberately visible in the PR timeline. In the merge queue the entry's
      # own PR must carry it, as each PR merging after a labelled one had to;
      # scripts/coverage_exception.py owns that and fails closed.
      - name: Check coverage-exception label
        id: exception
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          REPO: ${{ github.repository }}
        run: python3 scripts/coverage_exception.py

      - name: Coverage report and threshold
        env:
          EXCEPTION: ${{ steps.exception.outputs.has_exception || '0' }}
        run: |
          set -euo pipefail
          # `json` enforces fail_under too, which would stop a labelled PR here, before the bypass.
          coverage json -o coverage.json --fail-under=0
          {
            echo "## Coverage"
            echo '```'
            coverage report --fail-under=0
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$EXCEPTION" != "0" ]; then
            echo "Threshold skipped (coverage-exception label)."
            coverage report --fail-under=0 > coverage-report.txt
          else
            coverage report > coverage-report.txt || { cat coverage-report.txt; exit 1; }
          fi
          cat coverage-report.txt

      # Written here, before the upload, and posted by `coverage-comment`. Like the comment before it, it is
      # not written when the threshold step fails.
      - name: Build coverage comment body
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          {
            echo "<!-- coverage-marker -->"
            echo "### Coverage"
            echo ""
            echo '```text'
            cat coverage-report.txt
            echo '```'
            echo ""
            echo "_Threshold: \`fail_under\` in pyproject.toml · label \`coverage-exception\` to bypass (visible in PR timeline)._"
          } > coverage-comment.md

      - name: Upload coverage artifact
        # actions/upload-artifact@v7 — pinned to immutable SHA.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage.json
            coverage-comment.md
          retention-days: 7

  # Posts the report `coverage` wrote. A separate job so the write token never shares a job with the pip cache
  # `coverage` restores or the packages it installs; it checks out nothing and runs only the pinned artifact and
  # comment actions, as `frontend-coverage-comment` does. Sticky: find-and-update rather than spam. Same-repo
  # PRs only, since a fork PR gets a read-only token, and it never gates: the threshold is enforced in `coverage`.
  coverage-comment:
    name: Coverage comment
    needs: coverage
    # `!cancelled()` rather than `always()`: a run superseded by a newer push must not post its older figures.
    if: >-
      !cancelled() && needs.coverage.result != 'skipped' && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # sticky coverage comment (same-repo PRs only)
    steps:
      - name: Fetch the coverage report
        id: fetch
        continue-on-error: true
        # actions/download-artifact@v8.0.1, the same pin as release.yml.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: coverage-${{ github.run_id }}
          path: coverage
      - name: Find existing coverage comment
        # hashFiles reads only the workspace, which is why the report is fetched there.
        if: steps.fetch.outcome == 'success' && hashFiles('coverage/coverage-comment.md') != ''
        id: find-comment
        continue-on-error: true
        # peter-evans/find-comment@v4 — pinned to immutable SHA.
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: "<!-- coverage-marker -->"
      - name: Post coverage comment
        if: steps.find-comment.outcome == 'success'
        continue-on-error: true
        # peter-evans/create-or-update-comment@v5 — pinned to immutable SHA.
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body-path: coverage/coverage-comment.md
          edit-mode: replace

  # Coverage and its sticky comment stay Ubuntu-only; this job checks native
  # macOS behavior without repeating the Ubuntu suite from `test` and
  # `runtime-floor`. Windows CI was retired after the frontend refactor. It runs
  # only when `platform` is on: a change to a reviewed platform-sensitive path, the
  # gate's own wiring or a path the detector does not recognise, and every push to
  # main, nightly run and manual dispatch.
  platform-tests:
    name: Tests (${{ matrix.os }}, ${{ matrix.suite }} ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.python == 'true' && needs.changes.outputs.platform == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false # one platform failing must not hide the others
      matrix:
        os: [macos-latest]
        suite: [dashboard, scripts]
        # Keep the measured script shards so the campaign tests and release
        # rehearsals do not hold the dashboard leg.
        shard: [1, 2, 3]
        exclude:
          - suite: dashboard
            shard: 2
          - suite: dashboard
            shard: 3
    steps:
      # actions/checkout@v7.0.1 — pinned to immutable SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python@v7.0.0 — pinned to immutable SHA.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      # The dashboard server itself is stdlib-only, but the repository
      # validator that scripts/tests/test_validate_plugins.py imports needs
      # PyYAML. The lint/type tooling in requirements-dev.txt is not needed
      # here — this job only runs unittest.
      - name: Install validation requirements
        run: python -m pip install -r requirements-validation.txt
      - name: Show interpreter
        run: python -c "import sys, os; print(sys.version, os.name, sys.platform)"
      - name: Confirm sqlite3 is present on this runner
        run: python -c "import sqlite3; print(sqlite3.sqlite_version)"
      - name: Run dashboard test discovery
        if: matrix.suite == 'dashboard'
        run: python scripts/run_tests.py --slowest 10 -s compass/skills/compass/tests -t .
      - name: Run script unit tests
        if: matrix.suite == 'scripts'
        run: python scripts/run_tests.py --slowest 10 --shard ${{ matrix.shard }}/3 -s scripts/tests -t scripts/tests

  # The dashboard suite on 3.15 (the newest stable minor on 2026-11-02), moved by hand when a new
  # minor ships. supervise.py watches a session's exit with `os.waitid` wherever `os` has it and a
  # kqueue exit filter otherwise. macOS gained `waitid` in 3.13, so with `platform` on this leg runs
  # on macOS and takes waitid beside the 3.12 kqueue leg above. With it off the leg runs on Linux,
  # because no other job runs this interpreter and a change outside the platform list can still
  # break on it.
  platform-tests-current:
    name: Tests (${{ matrix.os }}, Python 3.15, dashboard)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ["${{ needs.changes.outputs.platform == 'true' && 'macos-latest' || 'ubuntu-latest' }}"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install validation requirements
        run: python -m pip install -r requirements-validation.txt
      - name: Show interpreter
        run: python -c "import sys, os; print(sys.version, os.name, sys.platform, hasattr(os, 'waitid'))"
      - name: Run dashboard test discovery
        run: python scripts/run_tests.py --slowest 10 -s compass/skills/compass/tests -t .

  # Every frontend change, on Linux. The Vitest suite runs on Linux in `frontend-coverage`, so this
  # job runs the Node build tests that `pnpm test` adds to it rather than the suite a second time.
  frontend:
    name: Frontend (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    # The browser proofs are no longer part of the gate (owner, 2026-10-12): the UI is verified by the
    # `storybook` job below. Their scripts stay in package.json and run on demand.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      # actions/setup-node@v7.0.0 — exact verified release commit.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          check-latest: false
          package-manager-cache: false
      # pnpm/setup@v3.0.0 verifies its native pnpm download's signature/checksum.
      # Keep Node authoritative above, and run the script-denied install explicitly.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 12.9.1
          install: false
          node-version-file: false
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: python
        with:
          python-version: "3.12"
      - name: Verify effective builder versions
        timeout-minutes: 1
        run: node -e "const fs=require('node:fs');const wanted=fs.readFileSync('.node-version','utf8').trim();if(process.versions.node!==wanted)throw Error('Unexpected Node '+process.versions.node);console.log('Node '+process.versions.node)"
      - name: Frozen install with dependency scripts denied
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Frontend lint
        timeout-minutes: 2
        run: pnpm lint
      - name: Strict frontend types
        timeout-minutes: 2
        run: pnpm typecheck
      - name: Hand-written CSS ratchet against the actual PR base
        if: github.event_name == 'pull_request'
        timeout-minutes: 1
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm test:styles
      - name: Build tests that run Python against the plugin
        timeout-minutes: 3
        env:
          COMPASS_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: node --test frontend/build/*.test.mjs
      - name: Owned development lifecycle and isolation tests
        timeout-minutes: 3
        env:
          COMPASS_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: pnpm test:dev
      - name: Clean native preview build (not the shipping artifact)
        timeout-minutes: 3
        run: pnpm build:preview

  # The same suite natively on macOS, where `pnpm test:dev`'s process handling differs, only when
  # `platform` is on. Lint, types and the CSS ratchet read no platform, so they stay on Linux.
  frontend-macos:
    name: Frontend (macos-latest)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && needs.changes.outputs.platform == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node@v7.0.0 — exact verified release commit.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          check-latest: false
          package-manager-cache: false
      # pnpm/setup@v3.0.0 verifies its native pnpm download's signature/checksum.
      # Keep Node authoritative above, and run the script-denied install explicitly.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 12.9.1
          install: false
          node-version-file: false
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: python
        with:
          python-version: "3.12"
      - name: Verify effective builder versions
        timeout-minutes: 1
        run: node -e "const fs=require('node:fs');const wanted=fs.readFileSync('.node-version','utf8').trim();if(process.versions.node!==wanted)throw Error('Unexpected Node '+process.versions.node);console.log('Node '+process.versions.node)"
      - name: Frozen install with dependency scripts denied
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Frontend behavioral unit tests
        # 6 minutes timed out on a suite whose every test had passed: the macOS runner took 5m16s on the
        # commit before (2026-10-28). release.yml's copy of this step is held to the same limit.
        timeout-minutes: 10
        run: pnpm test
      - name: Owned development lifecycle and isolation tests
        timeout-minutes: 3
        env:
          COMPASS_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: pnpm test:dev
      - name: Clean native preview build (not the shipping artifact)
        timeout-minutes: 3
        run: pnpm build:preview

  # The frontend's coverage threshold, held the way the Python one is in `test` above. The thresholds live in
  # vitest.config.mts so `pnpm test:coverage` enforces the same gate locally, and a PR labeled
  # `coverage-exception` may merge below them. Ubuntu only, as the Python coverage is, and this is the Linux run of
  # the Vitest suite; `frontend-macos` runs it natively when `platform` is on. The token here stays read-only, because this job runs the frontend's
  # third-party test dependencies: the sticky comment is posted by `frontend-coverage-comment`, which runs none.
  frontend-coverage:
    name: Frontend tests + coverage threshold
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read # the coverage-exception label check, before any dependency is installed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node@v7.0.0 — exact verified release commit.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          check-latest: false
          package-manager-cache: false
      # pnpm/setup@v3.0.0 verifies its native pnpm download's signature/checksum.
      # Keep Node authoritative above, and run the script-denied install explicitly.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 12.9.1
          install: false
          node-version-file: false
          cache: false
      # The same check as the Python job's, on the runner's own Python: stdlib only, before any install.
      - name: Check coverage-exception label
        id: exception
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          REPO: ${{ github.repository }}
        run: python3 scripts/coverage_exception.py
      - name: Verify effective builder versions
        timeout-minutes: 1
        run: node -e "const fs=require('node:fs');const wanted=fs.readFileSync('.node-version','utf8').trim();if(process.versions.node!==wanted)throw Error('Unexpected Node '+process.versions.node);console.log('Node '+process.versions.node)"
      - name: Frozen install with dependency scripts denied
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Tests and the threshold in one run: Vitest checks the thresholds after the suite, and a failing test
      # fails the step with or without the label.
      - name: Frontend suite under coverage, and the threshold
        timeout-minutes: 10
        env:
          EXCEPTION: ${{ steps.exception.outputs.has_exception || '0' }}
        run: |
          set -euo pipefail
          if [ "$EXCEPTION" != "0" ]; then
            echo "Threshold skipped (coverage-exception label)."
            pnpm test:coverage --coverage.thresholds.statements=0 --coverage.thresholds.branches=0 \
              --coverage.thresholds.functions=0 --coverage.thresholds.lines=0
          else
            pnpm test:coverage
          fi
      - name: Coverage summary
        if: always()
        timeout-minutes: 1
        run: |
          set -euo pipefail
          SUMMARY=coverage/frontend/coverage-summary.json
          if [ ! -f "$SUMMARY" ]; then
            echo "No coverage summary was written."
            exit 0
          fi
          node - "$SUMMARY" <<'JS'
          const fs = require('node:fs');
          const total = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')).total;
          const rows = ['statements', 'branches', 'functions', 'lines'].map(
            (k) => `| ${k} | ${total[k].pct.toFixed(2)}% | ${total[k].covered} / ${total[k].total} |`,
          );
          const footer =
            '_Thresholds: `coverage.thresholds` in vitest.config.mts · label `coverage-exception` to bypass ' +
            '(visible in PR timeline)._';
          const lines = ['<!-- frontend-coverage-marker -->', '### Frontend coverage', ''];
          lines.push('| Metric | Covered | Count |', '|---|---|---|', ...rows, '', footer, '');
          fs.writeFileSync('coverage/frontend/comment.md', lines.join('\n'));
          JS
          cat coverage/frontend/comment.md >> "$GITHUB_STEP_SUMMARY"
          cat coverage/frontend/comment.md
      - name: Upload frontend coverage artifact
        if: always()
        # actions/upload-artifact@v7 — pinned to immutable SHA.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontend-coverage-${{ github.run_id }}
          path: |
            coverage/frontend/coverage-summary.json
            coverage/frontend/comment.md
          if-no-files-found: ignore
          retention-days: 7

  # Posts the summary `frontend-coverage` wrote. A separate job so the write token never shares a job with
  # third-party package code; it checks out nothing and runs only the two pinned comment actions. Like the
  # Python comment, it never gates: the threshold is enforced in `frontend-coverage`.
  frontend-coverage-comment:
    name: Frontend coverage comment
    needs: frontend-coverage
    # `!cancelled()` rather than `always()`: a run superseded by a newer push must not post its older figures.
    if: >-
      !cancelled() && needs.frontend-coverage.result != 'skipped' && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # sticky coverage comment (same-repo PRs only)
    steps:
      - name: Fetch the coverage summary
        id: fetch
        continue-on-error: true
        # actions/download-artifact@v8.0.1, the same pin as release.yml.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: frontend-coverage-${{ github.run_id }}
          path: frontend-coverage
      - name: Find existing frontend coverage comment
        # hashFiles reads only the workspace, which is why the summary is fetched there.
        if: steps.fetch.outcome == 'success' && hashFiles('frontend-coverage/comment.md') != ''
        id: find-comment
        continue-on-error: true
        # peter-evans/find-comment@v4 — pinned to immutable SHA.
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: "<!-- frontend-coverage-marker -->"
      - name: Post frontend coverage comment
        if: steps.find-comment.outcome == 'success'
        continue-on-error: true
        # peter-evans/create-or-update-comment@v5 — pinned to immutable SHA.
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body-path: frontend-coverage/comment.md
          edit-mode: replace

  # The shipped bundle is rebuilt from its sources and compared with the tracked file. Ubuntu only: the bundle is
  # platform-independent bytes, and a stale artifact has been caught here that a local build did not show. The
  # parity proofs that used to run against the bundle are retired from the gate (owner, 2026-10-12).
  frontend-production:
    name: Frontend production bundle (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node@v7.0.0 — exact verified release commit.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          check-latest: false
          package-manager-cache: false
      # pnpm/setup@v3.0.0 verifies its native pnpm download's signature/checksum.
      # Keep Node authoritative above, and run the script-denied install explicitly.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 12.9.1
          install: false
          node-version-file: false
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: python
        with:
          python-version: "3.12"
      - name: Verify effective builder versions
        timeout-minutes: 1
        run: node -e "const fs=require('node:fs');const wanted=fs.readFileSync('.node-version','utf8').trim();if(process.versions.node!==wanted)throw Error('Unexpected Node '+process.versions.node);console.log('Node '+process.versions.node)"
      - name: Frozen install with dependency scripts denied
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Canonical rebuild and tracked artifact comparison
        timeout-minutes: 3
        run: pnpm build:check

  storybook:
    name: Storybook (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    # The cold host-package install below may use its whole 11 minutes; the rest took about 4.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          check-latest: false
          package-manager-cache: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 12.9.1
          install: false
          node-version-file: false
          cache: false
      - name: Frozen install with dependency scripts denied
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build offline component stories
        timeout-minutes: 3
        run: pnpm build:storybook
      # `--with-deps` timed out at 5 minutes on 2 of about 8 runs (2026-11-06). Both spent the whole step
      # fetching nine font packages (21.9 MB) from the Ubuntu mirror at tens of KB/s; the browser itself
      # downloaded in about 6 s, and every library Chromium needs was already on the image. So the host
      # packages install apart, bounded and retried once.
      # Neither half is cached (owner ruling, 2026-11-06), because a restored entry is trusted twice over.
      # Its files run as they are: the browser cache held the `chrome` binary `pnpm test:stories` starts.
      # And actions/cache extracts with `tar -P`, so an entry can also write outside the cached path. An
      # entry saved after third-party code ran in a main-branch job could do either, so neither a member
      # check nor dropping `restore-keys` would make one safe. This job holds no key, but it runs code.
      # The cost is a fresh download every run. The browser comes from Playwright's CDN, about 6 s, in one
      # attempt: a CDN stall past 3 minutes now fails the gate on any run, as it already does a release.
      - name: Install pinned Chromium
        timeout-minutes: 3
        run: pnpm exec playwright install chromium
      # A healthy install takes 14 s. Every run is now cold, and run 42181043035 fetched the fonts at a
      # steady 46 KB/s, so the 21.9 MB need about 475 s. A retry keeps the packages apt finished, so the
      # budget is the sum of both bounds: 600 s, and the step's limit leaves room for both.
      - name: Install Chromium's host packages, retried once
        timeout-minutes: 11
        run: |
          set -uo pipefail
          BOUND=300
          for attempt in 1 2; do
            if timeout --kill-after=10 "$BOUND" pnpm exec playwright install-deps chromium; then
              exit 0
            fi
            echo "::warning::Chromium's host packages did not install in $BOUND s (attempt $attempt of 2)."
            sudo dpkg --configure -a
          done
          echo "::error::Chromium's host packages did not install after two bounded attempts."
          exit 1
      - name: Component assertions and offline runtime proof
        timeout-minutes: 5
        run: pnpm test:stories

  # The frontend tests that start or read the Python runtime: `pnpm test:dev` launches server.py, the build
  # tests run Python against the plugin, and a few Vitest files import compass_runtime. A runtime change runs
  # these instead of the whole frontend lane; when that lane runs, it already includes them. On macOS when
  # `platform` is on, as `frontend-macos` is, and on Linux otherwise.
  frontend-contract:
    name: Frontend tests that read the runtime
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ${{ needs.changes.outputs.platform == 'true' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node@v7.0.0 — exact verified release commit.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          check-latest: false
          package-manager-cache: false
      # pnpm/setup@v3.0.0 verifies its native pnpm download's signature/checksum.
      # Keep Node authoritative above, and run the script-denied install explicitly.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 12.9.1
          install: false
          node-version-file: false
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: python
        with:
          python-version: "3.12"
      - name: Verify effective builder versions
        timeout-minutes: 1
        run: node -e "const fs=require('node:fs');const wanted=fs.readFileSync('.node-version','utf8').trim();if(process.versions.node!==wanted)throw Error('Unexpected Node '+process.versions.node);console.log('Node '+process.versions.node)"
      - name: Frozen install with dependency scripts denied
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Owned development lifecycle and isolation tests
        timeout-minutes: 3
        env:
          COMPASS_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: pnpm test:dev
      - name: Build tests that run Python against the plugin
        timeout-minutes: 3
        env:
          COMPASS_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: node --test frontend/build/*.test.mjs
      # Derived, not listed, so a new test that names the runtime is picked up without an edit here.
      - name: Vitest files that read the runtime
        timeout-minutes: 5
        env:
          COMPASS_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          FILES=$(grep -rlE 'compass/skills/compass' frontend --include='*.test.ts' --include='*.test.tsx' \
                    --exclude-dir=node_modules | sort)
          if [ -z "$FILES" ]; then
            echo "::error::No Vitest file names the runtime, so the derivation is broken."
            exit 1
          fi
          echo "$FILES"
          # shellcheck disable=SC2086 # one path per word; repository paths hold no spaces
          pnpm exec vitest run $FILES

  # A document only Vitest files read (the citation check, for a document a frontend file cites) runs those
  # files on Linux instead of the whole frontend lane. When that lane runs, it already includes them.
  frontend-docs:
    name: Frontend tests that read the changed documents
    needs: changes
    if: needs.changes.outputs.frontend_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node@v7.0.0 — exact verified release commit.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          check-latest: false
          package-manager-cache: false
      # pnpm/setup@v3.0.0 verifies its native pnpm download's signature/checksum.
      # Keep Node authoritative above, and run the script-denied install explicitly.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 12.9.1
          install: false
          node-version-file: false
          cache: false
      - name: Verify effective builder versions
        timeout-minutes: 1
        run: node -e "const fs=require('node:fs');const wanted=fs.readFileSync('.node-version','utf8').trim();if(process.versions.node!==wanted)throw Error('Unexpected Node '+process.versions.node);console.log('Node '+process.versions.node)"
      - name: Frozen install with dependency scripts denied
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Vitest files that read the changed documents
        timeout-minutes: 5
        env:
          FILES: ${{ needs.changes.outputs.frontend_docs_tests }}
        run: |
          set -euo pipefail
          if [ -z "$FILES" ]; then
            echo "::error::The lane is on but names no test file, so the derivation is broken."
            exit 1
          fi
          echo "$FILES"
          # shellcheck disable=SC2086 # one path per word; repository paths hold no spaces
          pnpm exec vitest run $FILES

  # The single required status check. Branch protection requires this job, so
  # a measurable job may skip only when the detector turned its lane off.
  quality-gate:
    name: quality-gate
    needs:
      - changes
      - lint
      - typecheck
      - runtime-floor
      - test
      - coverage
      - platform-tests
      - platform-tests-current
      - frontend
      - frontend-macos
      - frontend-coverage
      - frontend-production
      - storybook
      - frontend-contract
      - frontend-docs
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all gate jobs succeeded
        env:
          PYTHON: ${{ needs.changes.outputs.python }}
          LINT: ${{ needs.changes.outputs.lint }}
          FRONTEND: ${{ needs.changes.outputs.frontend }}
          CONTRACT: ${{ needs.changes.outputs.contract }}
          SUITES: ${{ needs.changes.outputs.python_suites }}
          FRONTEND_DOCS: ${{ needs.changes.outputs.frontend_docs }}
          PLATFORM: ${{ needs.changes.outputs.platform }}
          R_CHANGES: ${{ needs.changes.result }}
          R_LINT: ${{ needs.lint.result }}
          R_TYPECHECK: ${{ needs.typecheck.result }}
          R_FLOOR: ${{ needs.runtime-floor.result }}
          R_TEST: ${{ needs.test.result }}
          R_COVERAGE: ${{ needs.coverage.result }}
          R_PLATFORM: ${{ needs.platform-tests.result }}
          R_PLATFORM_CURRENT: ${{ needs.platform-tests-current.result }}
          R_FRONTEND: ${{ needs.frontend.result }}
          R_FRONTEND_MACOS: ${{ needs.frontend-macos.result }}
          R_FRONTEND_COVERAGE: ${{ needs.frontend-coverage.result }}
          R_FRONTEND_PRODUCTION: ${{ needs.frontend-production.result }}
          R_STORYBOOK: ${{ needs.storybook.result }}
          R_CONTRACT: ${{ needs.frontend-contract.result }}
          R_FRONTEND_DOCS: ${{ needs.frontend-docs.result }}
        run: |
          set -euo pipefail
          echo "changes: $R_CHANGES (python=$PYTHON lint=$LINT frontend=$FRONTEND contract=$CONTRACT python_suites=$SUITES frontend_docs=$FRONTEND_DOCS platform=$PLATFORM)"

          # The detector itself is never allowed to skip or fail. If it did, we
          # do not know whether the measurable jobs were skipped on purpose or lost,
          # and "we do not know" must not read as green on a required check.
          if [ "$R_CHANGES" != "success" ]; then
            echo "::error::The change detector did not succeed; refusing to report a gate result."
            exit 1
          fi

          # A macOS leg runs when its lane AND `platform` are on, so that conjunction is its lane.
          # Like every lane, `platform` fails closed: a lost or garbled answer is not "off".
          if [ "$PLATFORM" != "true" ] && [ "$PLATFORM" != "false" ]; then
            echo "::error::The detector's platform answer is '$PLATFORM', not true or false."
            exit 1
          fi
          both() { if [ "$1" = "true" ] && [ "$2" = "true" ]; then echo true; else echo false; fi; }
          PYTHON_MACOS=$(both "$PYTHON" "$PLATFORM")
          FRONTEND_MACOS=$(both "$FRONTEND" "$PLATFORM")

          # Each job names the lane that runs it. `skipped` is a pass ONLY when the
          # detector said that lane is off; anything else skipped means a dependency
          # failed upstream and GitHub cascaded it, which is a failure, not a pass.
          for row in "lint:$LINT:$R_LINT" "typecheck:$PYTHON:$R_TYPECHECK" \
                     "runtime-floor:$SUITES:$R_FLOOR" "test:$PYTHON:$R_TEST" \
                     "coverage:$PYTHON:$R_COVERAGE" "platform-tests:$PYTHON_MACOS:$R_PLATFORM" \
                     "platform-tests-current:$PYTHON:$R_PLATFORM_CURRENT" "frontend:$FRONTEND:$R_FRONTEND" \
                     "frontend-macos:$FRONTEND_MACOS:$R_FRONTEND_MACOS" \
                     "frontend-coverage:$FRONTEND:$R_FRONTEND_COVERAGE" \
                     "frontend-production:$FRONTEND:$R_FRONTEND_PRODUCTION" \
                     "storybook:$FRONTEND:$R_STORYBOOK" "frontend-contract:$CONTRACT:$R_CONTRACT" \
                     "frontend-docs:$FRONTEND_DOCS:$R_FRONTEND_DOCS"; do
            job=${row%%:*}
            rest=${row#*:}
            lane=${rest%%:*}
            res=${rest#*:}
            echo "$job: $res (lane on: $lane)"
            if [ "$res" = "success" ]; then
              continue
            fi
            if [ "$res" = "skipped" ] && [ "$lane" = "false" ]; then
              continue
            fi
            echo "::error::$job did not succeed (result=$res, lane on: $lane)."
            exit 1
          done

          echo "Quality gate passed."
