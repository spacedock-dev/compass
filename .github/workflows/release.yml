name: Release

# Tag-driven releases. To release: update main, then push a strict-semver
# tag on the main tip (either `0.2.0` or `v0.2.0`):
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# Eight jobs, split by what each may hold:
#
#   resolve          read-only token, no Node, no key. Fixes ONE commit (the target)
#                    before anything runs: for a fresh release the main tip, captured
#                    once; for a resumed one the existing `chore(release): <tag>` commit.
#                    Refuses the tag unless it is strict semver, on main, and STRICTLY
#                    GREATER than every existing release tag (no back-tagging, ever);
#                    the resume path skips that last check on purpose, because a LATER
#                    release may have completed in between.
#   verify-frontend  read-only token, checkout WITHOUT persisted credentials, no key.
#                    The only job that installs frontend dependencies and runs them.
#                    Rebuilds the React bundle from exactly the target and compares it
#                    with the tracked artifact, lints, type-checks, tests, and runs the
#                    Python-only installed proof.
#   verify-tree      the same (no credentials). The repository validation suite on the
#                    target; it starts `node` whenever `node` is on PATH, so it cannot
#                    share a job with the deploy key.
#   build-cli        read-only token, no key, one job per release target. Builds the
#                    standalone `compass` binary with PyInstaller on a host of that OS and
#                    architecture (it cannot cross-compile), proves the packed archive
#                    runs, and hands it on as a build artifact. It runs third-party build
#                    dependencies, so what it produces is data to every later job.
#   release          holds the deploy key and runs NO Node, pnpm, npm, corepack or
#                    frontend dependency code. Refuses to continue unless its own
#                    checkout IS the target both verifiers saw, then writes the bump
#                    commit, proves `git archive` of the exact release commit with
#                    Python only, and only then pushes the bump, moves the tag, advances
#                    `stable` and publishes.
#   attach-cli       the write token, no deploy key. Downloads the four archives the
#                    build jobs made and attaches them, with `checksums.txt`, to the
#                    release by running scripts/publish-cli.sh.
#   marketplace      read-only repository token and the marketplace deploy key, a different
#                    credential from the release key that reaches only
#                    spacedock-dev/marketplace. Runs after `release`, so `stable` already
#                    serves the version it stamps onto the listing, and runs no dependency
#                    code: git, ssh and the Python standard library.
#   homebrew         read-only repository token and the tap deploy key, a third credential
#                    that reaches only spacedock-dev/homebrew-tap. Runs after `attach-cli`,
#                    because the formula it writes names the archives and their checksums.
#                    Like `marketplace`, it runs no dependency code.
#
# The binary embeds the interpreter and the runtime package and carries no manifest, so
# building the target (before the bump) and building the bump commit produce the same
# program; the archive name takes the version from the tag. `release` needs build-cli only
# as a gate: a build that fails stops the release before anything is pushed, tagged or
# published. attach-cli then runs after `release`, holds the write token but not the deploy
# key, and attaches the four archives and `checksums.txt` by running scripts/publish-cli.sh,
# which refuses anything but exactly those four. It is a separate job so that no artifact,
# which a third-party build dependency could have shaped, reaches the job that holds the key.
# The marketplace listing tracks `stable`, so a release reaches installs without `marketplace`;
# that job keeps the displayed version, which an installed copy compares against to notice an
# update, in step. It follows `release` only, so a failed archive attach does not hold the
# listing back, and a failure there leaves the published release in place: re-run just that job,
# which is safe because the stamp never moves the version backwards. `homebrew` is the same:
# a failure leaves the release and the tap's previous formula in place, and a re-run of that
# job alone is safe because the formula never moves the tap backwards.
# The price is that releases/latest has no archives for the minute attach-cli takes; the
# installer reports a missing archive and installs the rest. If this repository ever turns
# on immutable releases, assets must go up with the release instead. A resume of a release
# commit that predates scripts/package-cli.sh cannot pass build-cli and needs a manual release.
#
# If main advanced while the frontend was being verified, `release` fails before it
# mutates anything. Use "Re-run all jobs" on the same run: only that re-runs `resolve`,
# so the target, both verifiers and the publish all move to the new tip. "Re-run failed
# jobs" keeps the stale target and fails again. Every step is idempotent, so a re-run
# after any partial failure finishes the release instead of wedging, even if a LATER
# release completed in between: the resume path finds this tag's own release commit in
# main history, verifies that commit, and publishes it, never a newer main bundle.
# (Pushing the tag again does nothing: it already exists.) Those decisions
# live in scripts/release_transition.py and are tested against temporary
# repositories; the archive proof lives in scripts/verify_release_archive.py.
#
# The React bundle is version-independent (its provenance carries no release version),
# so the post-bump commit must ship byte-identical bundle files. The archive proof
# checks that, and that the bump touched nothing but the version manifests, before the
# tag or `stable` can move.
#
# Ruleset interplay: main requires PRs + the `validate` check, and semver
# tags are immutable, both with a bypass for the repository's release
# deploy key (secret RELEASE_DEPLOY_KEY), which is what lets the publishing job push
# the bump commit and move the tag over SSH. The deploy-key push also
# re-triggers the validate workflow on main (GITHUB_TOKEN pushes would
# not), so the bump commit gets a normal post-merge check run too.
# Humans cannot delete or move release tags at all.
#
# Security model:
#   - The release key exists in one job, and the write token in two: `release`, and
#     `attach-cli`, which has no key and runs no dependency code. The marketplace key
#     exists in one other job, `marketplace`, and the tap key in `homebrew`; each has
#     `contents: read` and cannot touch this repository. Every job that runs dependency code has `contents: read` and a
#     checkout with persist-credentials: false; tests pin that boundary
#     (compass/skills/compass/tests/test_release_workflow.py).
#   - Tag names reach shell only through env: and are validated against a strict
#     regex by release_transition.py before any use.
#   - Every action is pinned to an immutable SHA; toolchain pins match quality-gate.yml.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the release target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      version: ${{ steps.resolve.outputs.version }}
      target: ${{ steps.resolve.outputs.target }}
    steps:
      - name: Checkout main with full history and tags, without credentials
        # actions/checkout@v7.0.1, pinned to an immutable SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the tag and fix the release target
        id: resolve
        timeout-minutes: 2
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/release_transition.py resolve --tag "$TAG" --github-output "$GITHUB_OUTPUT"

  verify-frontend:
    name: Verify the frontend at the target
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      verified: ${{ steps.verified.outputs.sha }}
    env:
      TARGET: ${{ needs.resolve.outputs.target }}
    steps:
      - name: Checkout exactly the target, without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.target }}
          persist-credentials: false

      - name: Confirm the checkout is the target
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python3 scripts/release_transition.py assert-head --expected "$TARGET"

      # Same pins as the quality gate's frontend job; the tests compare them.
      # actions/setup-node@v7.0.0, exact verified release commit.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          check-latest: false
          package-manager-cache: false
      # pnpm/setup@v3.0.0 verifies its native pnpm download's signature/checksum.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 12.9.1
          install: false
          node-version-file: false
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: python
        with:
          python-version: "3.11"
      - name: Verify effective builder versions
        timeout-minutes: 1
        run: node -e "const fs=require('node:fs');const wanted=fs.readFileSync('.node-version','utf8').trim();if(process.versions.node!==wanted)throw Error('Unexpected Node '+process.versions.node);console.log('Node '+process.versions.node)"
      - name: Frozen install with dependency scripts denied
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Frontend lint
        timeout-minutes: 2
        run: pnpm lint
      - name: Strict frontend types
        timeout-minutes: 2
        run: pnpm typecheck
      # The limit quality-gate.yml gives the same command. A release run with 3 minutes timed
      # out on a suite that had passed (v1.1.0), so the two are held equal by
      # test_release_workflow.CiLimitsTest: raise one and the test says to raise the other.
      - name: Frontend behavioral unit tests
        timeout-minutes: 10
        run: pnpm test
      - name: Canonical rebuild and tracked artifact comparison
        timeout-minutes: 3
        run: pnpm build:check
      - name: Install pinned Chromium and its host dependencies
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium
      - name: Hostile inline artifact parser browser proof
        timeout-minutes: 3
        run: pnpm test:parser
      - name: Installed Python-only artifact browser proof
        timeout-minutes: 3
        env:
          COMPASS_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: pnpm test:installed
      - name: Confirm verification left the tracked tree untouched
        timeout-minutes: 1
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::verification changed the tracked tree, so it did not verify the target"
            git status --porcelain
            exit 1
          fi
      - name: Record the verified commit
        id: verified
        timeout-minutes: 1
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          if [ "$SHA" != "$TARGET" ]; then
            echo "::error::verified $SHA but the target is $TARGET"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  verify-tree:
    name: Validate the release tree
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      verified: ${{ steps.verified.outputs.sha }}
    env:
      TARGET: ${{ needs.resolve.outputs.target }}
      MODE: ${{ needs.resolve.outputs.mode }}
    steps:
      - name: Checkout exactly the target, without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.target }}
          persist-credentials: false

      - name: Confirm the checkout is the target
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python3 scripts/release_transition.py assert-head --expected "$TARGET"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: env.MODE == 'fresh'
        with:
          python-version: "3.12"
      - name: Install release validation dependencies
        if: env.MODE == 'fresh'
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --requirement requirements-validation.txt

      - name: Run the full validation suite on the release tree
        # A resumed release's tree was already validated when its bump commit was
        # first pushed.
        if: env.MODE == 'fresh'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python3 scripts/validate_plugins.py
          python3 -m unittest scripts/tests/test_validate_plugins.py
          python3 -m unittest scripts/tests/test_bump_version.py
          python3 -m unittest discover -s compass/skills/compass/tests -t .

      - name: Record the validated commit
        id: verified
        timeout-minutes: 1
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          if [ "$SHA" != "$TARGET" ]; then
            echo "::error::validated $SHA but the target is $TARGET"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build-cli:
    name: Build the CLI (${{ matrix.target }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: darwin_arm64
            runner: macos-15
          - target: darwin_amd64
            runner: macos-15-intel
          # The Linux hosts are the oldest image still offered: a PyInstaller binary
          # needs at least the glibc of the machine that built it, so building on the
          # newest image would shut out every older distribution for nothing.
          - target: linux_arm64
            runner: ubuntu-22.04-arm
          - target: linux_amd64
            runner: ubuntu-22.04
    env:
      TARGET: ${{ needs.resolve.outputs.target }}
      VERSION: ${{ needs.resolve.outputs.version }}
      ARCHIVE_TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout exactly the target, without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.target }}
          persist-credentials: false

      # The interpreter PyInstaller runs under is the one embedded in the binary, so the
      # version is pinned here and is the whole of "which Python do users get". It also
      # runs the target check below: ubuntu-22.04's own python3 is 3.10, under the floor.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: python
        with:
          python-version: "3.12"

      - name: Confirm the checkout is the target
        timeout-minutes: 1
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          "$PYTHON" scripts/release_transition.py assert-head --expected "$TARGET"

      - name: Install the pinned build toolchain, wheels only
        timeout-minutes: 5
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          "$PYTHON" -m pip install --disable-pip-version-check --only-binary=:all: --requirement requirements-cli.txt

      - name: Build the binary and pack the archive
        timeout-minutes: 10
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          scripts/package-cli.sh "$VERSION" "$RUNNER_TEMP/cli" .
          test -f "$RUNNER_TEMP/cli/compass_${VERSION}_${ARCHIVE_TARGET}.tar.gz"

      - name: Run the packed archive
        timeout-minutes: 3
        run: |
          set -euo pipefail
          scripts/smoke-cli.sh "$RUNNER_TEMP/cli/compass_${VERSION}_${ARCHIVE_TARGET}.tar.gz"

      - name: Keep the archive for the publishing job
        # actions/upload-artifact@v7, the same pin as quality-gate.yml.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compass-cli-${{ matrix.target }}
          path: ${{ runner.temp }}/cli/compass_${{ needs.resolve.outputs.version }}_${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    needs: [resolve, verify-frontend, verify-tree, build-cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      MODE: ${{ needs.resolve.outputs.mode }}
      VERSION: ${{ needs.resolve.outputs.version }}
      TARGET: ${{ needs.resolve.outputs.target }}
      VERIFIED_FRONTEND: ${{ needs.verify-frontend.outputs.verified }}
      VERIFIED_TREE: ${{ needs.verify-tree.outputs.verified }}
    steps:
      - name: Checkout main with full history and tags
        # actions/checkout@v7.0.1, pinned to an immutable SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          # Pushes authenticate as the release deploy key, the bypass actor
          # on both rulesets. GITHUB_TOKEN cannot push to protected main.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          persist-credentials: true

      - name: Put HEAD on the verified commit before any repository code runs
        # Plain shell, and the first command this job runs: the key is already on disk
        # here, so no script from a tree nobody verified may execute first. Fresh: HEAD
        # must be the target. Resume: the target is an older release commit, so detach
        # onto it; main's own ref is consulted afterwards by the assertion below.
        run: |
          set -euo pipefail
          if ! [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the resolved target is not a full commit SHA"
            exit 1
          fi
          if [ "$MODE" = "fresh" ]; then
            if [ "$(git rev-parse HEAD)" != "$TARGET" ]; then
              echo "::error::main is no longer the commit this run resolved ($TARGET). The release commit may already be on main if this is a retry. Use Re-run all jobs on this run, so resolve takes the new tip and the verifiers cover it."
              exit 1
            fi
          elif [ "$MODE" = "resume" ]; then
            git checkout --detach "$TARGET"
          else
            echo "::error::unknown release mode"
            exit 1
          fi

      - name: Refuse to publish anything but the verified tree
        run: |
          set -euo pipefail
          python3 scripts/release_transition.py assert-checkout \
            --mode "$MODE" --target "$TARGET" --tag "$TAG" \
            --verified "$VERIFIED_FRONTEND" --verified "$VERIFIED_TREE"

      - name: Install release validation dependencies
        # An isolated environment called by explicit path, never put on PATH: a console
        # script in it must not shadow `git` or `gh` beside the key. Wheels only, so
        # installing runs no build script. The archive proof runs under `-I`, which
        # drops the user site, so the YAML dependency lives in this interpreter.
        # The standalone public-note gate also runs on resume and imports YAML.
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: --requirement requirements-validation.txt

      - name: Prepare and validate the public release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/compass-release-notes.md"
          # Fetch the raw generated body before bumping or moving any release
          # reference. A private tracker reference requires a curated correction;
          # the workflow never rewrites or publishes an unchecked body.
          LOOKUP_RESPONSE="$RUNNER_TEMP/compass-release-lookup.txt"
          if gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$LOOKUP_RESPONSE"; then
            LOOKUP_EXIT=0
          else
            LOOKUP_EXIT=$?
          fi
          # Only an authenticated, well-formed 404 proves that generation is
          # appropriate. Transport/permission/parse failure is not absence.
          LOOKUP_STATE=$(python3 - "$LOOKUP_RESPONSE" "$NOTES_FILE" "$LOOKUP_EXIT" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          try:
              response = Path(sys.argv[1]).read_text(encoding="utf-8")
              headers, separator, raw_body = response.partition("\n\n")
              first_line = headers.split("\n", 1)[0]
              status = re.fullmatch(r"HTTP/\d+(?:\.\d+)? (200|404)(?: [^\n]*)?", first_line)
              payload = json.loads(raw_body) if separator else None
              exit_code = int(sys.argv[3])
              if not status or not isinstance(payload, dict):
                  raise ValueError("unproven response")
              if status.group(1) == "200" and exit_code == 0 and isinstance(payload.get("body"), str):
                  Path(sys.argv[2]).write_text(payload["body"], encoding="utf-8")
                  print("existing")
              elif status.group(1) == "404" and exit_code == 1 and payload.get("message") == "Not Found":
                  print("missing")
              else:
                  raise ValueError("unproven lookup")
          except (OSError, UnicodeError, ValueError, TypeError):
              sys.exit("::error::Release lookup did not prove an existing text body or absence; refusing release mutations.")
          PY
          )
          if [ "$LOOKUP_STATE" = "missing" ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              --method POST -f "tag_name=$TAG" -f "target_commitish=$TARGET" \
              --jq .body > "$NOTES_FILE"
          fi
          "$RUNNER_TEMP/release-venv/bin/python" scripts/validate_plugins.py --public-text "$NOTES_FILE"
          echo "NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"

      - name: Write the version bump commit
        if: env.MODE == 'fresh'
        run: |
          set -euo pipefail
          # Nothing to write when the manifests already carry the tagged version (an
          # intentional release of the current version, such as the initial release).
          # bump_version.py independently refuses any target that is not strictly
          # greater than the current version, and the field list is read from it
          # rather than restated here.
          python3 scripts/release_transition.py bump --tag "$TAG"
          python3 scripts/release_transition.py commit-bump --tag "$TAG"

      - name: Record the commit this release publishes
        run: |
          set -euo pipefail
          FINAL=$(python3 scripts/release_transition.py final --mode "$MODE" --target "$TARGET")
          echo "FINAL=$FINAL" >> "$GITHUB_ENV"

      - name: Prove the archive of the exact release commit, Python only
        # Before the bump is pushed, the tag moved or `stable` advanced. The archived
        # Python runs with an empty PATH, so it cannot reach Node, but it is still this
        # job's user: this is not credential isolation.
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/release-venv/bin/python" scripts/verify_release_archive.py --repo . --commit "$FINAL" --verified "$TARGET" --version "$VERSION"

      - name: Push the release commit to main
        if: env.MODE == 'fresh'
        run: |
          set -euo pipefail
          # No --force: if main advanced mid-run this rejects cleanly and a
          # re-run resumes from the new tip.
          python3 scripts/release_transition.py push-bump --final "$FINAL"

      - name: Move the tag onto the release commit
        run: |
          set -euo pipefail
          # So `git checkout <tag>` shows the released (bumped) manifests. Allowed
          # only via the deploy-key bypass on the tag ruleset.
          python3 scripts/release_transition.py move-tag --tag "$TAG" --final "$FINAL"

      - name: Advance the stable branch
        run: |
          set -euo pipefail
          # spacedock-dev/marketplace lists compass with `"ref": "stable"`, the
          # same moving-channel idiom the spacedock entry uses. This is what
          # makes the listing self-updating: without it the marketplace would
          # serve whatever stable pointed at when it was written, forever.
          # Moves forward only: a resume of an older release leaves a newer stable alone.
          python3 scripts/release_transition.py advance-stable --final "$FINAL"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists - nothing to publish."
            exit 0
          fi
          gh release create "$TAG" \
            --title "Compass $VERSION" \
            --notes-file "$NOTES_FILE" \
            --verify-tag

  attach-cli:
    name: Attach the CLI archives
    needs: [resolve, build-cli, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The repository write token and nothing else: no deploy key, so no push to main and
    # no tag move. It can add files to a release and do no more. The archives come from
    # the build jobs, which run third-party dependencies, so this job treats them as data:
    # it checksums and uploads them, and never unpacks or runs one.
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      TARGET: ${{ needs.resolve.outputs.target }}
    steps:
      - name: Checkout exactly the target, without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.target }}
          persist-credentials: false

      - name: Confirm the checkout is the target
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python3 scripts/release_transition.py assert-head --expected "$TARGET"

      - name: Fetch the CLI archives the build jobs made
        # actions/download-artifact@v8.0.1, pinned to an immutable SHA.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: compass-cli-*
          merge-multiple: true
          path: ${{ runner.temp }}/cli

      - name: Attach the archives and checksums to the release
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # --clobber inside the script makes a re-run of an interrupted release safe.
          scripts/publish-cli.sh "$TAG" "$RUNNER_TEMP/cli"

  marketplace:
    name: Stamp the marketplace listing
    needs: [resolve, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The marketplace key and a read-only token. The key is a deploy key on
    # spacedock-dev/marketplace alone, so it cannot push to main here or move a tag. The
    # job runs one shell script from the verified target and no dependency code.
    permissions:
      contents: read
    env:
      TARGET: ${{ needs.resolve.outputs.target }}
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout exactly the target, without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.target }}
          persist-credentials: false

      - name: Confirm the checkout is the target
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python3 scripts/release_transition.py assert-head --expected "$TARGET"

      - name: Stamp the released version onto the marketplace listing
        timeout-minutes: 5
        env:
          MARKETPLACE_DEPLOY_KEY: ${{ secrets.MARKETPLACE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          # An unchanged or newer listing is a no-op, so a re-run of this job is safe.
          scripts/publish-marketplace.sh "$VERSION"

  homebrew:
    name: Write the Homebrew formula
    needs: [resolve, attach-cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The tap key and a read-only token. The key is a deploy key on spacedock-dev/homebrew-tap
    # alone, so it cannot push to main here or move a tag. It follows `attach-cli` because the
    # formula names the archives and their published checksums. The job runs one shell script
    # from the verified target and no dependency code.
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      TARGET: ${{ needs.resolve.outputs.target }}
    steps:
      - name: Checkout exactly the target, without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.target }}
          persist-credentials: false

      - name: Confirm the checkout is the target
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python3 scripts/release_transition.py assert-head --expected "$TARGET"

      - name: Write the released version's formula into the tap
        timeout-minutes: 5
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          # An unchanged or newer formula is a no-op, so a re-run of this job is safe.
          scripts/publish-homebrew.sh "$TAG"
