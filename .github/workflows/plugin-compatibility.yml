name: Plugin Compatibility

# Canary: installs the LATEST published Codex, Claude Code, Gemini CLI, and
# Antigravity CLI releases and smoke-tests compass's native package layout
# in each — detecting upstream compatibility changes as soon as they ship.
# Adapted from DataRecce/recce-team (single-plugin, no MCP, no hooks).
#
# The fast contract checks (validator + unit tests) live in validate.yml,
# which is the required PR status check; this workflow is the slower,
# deliberately unpinned client canary. The weekly schedule keeps it useful
# between PRs — upstream clients release faster than this repo changes.

on:
  pull_request:
    # Prose only. This canary installs upstream CLIs and smoke-tests the
    # package LAYOUT; none of these files is part of it. Safe to filter because
    # `latest-client-smoke` is NOT a required check — a filtered required check
    # never reports, and branch protection reads "never reported" as pending
    # forever. `SKILL.md` is deliberately absent: it ships inside the plugin.
    paths-ignore:
      - 'README.md'
      - 'HOW_TO_USE.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - 'COMPATIBILITY.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - 'docs/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/ISSUE_TEMPLATE/**'
      # A workflow file cannot change the package LAYOUT this canary measures,
      # and editing one used to install four upstream CLIs over the network to
      # prove it. The trade is that a change to THIS file no longer runs on its
      # own PR; the push-to-main and Monday schedule runs cover it, and it is
      # not a required check, so nothing is gated on the gap.
      - '.github/workflows/**'
  push:
    branches:
      - main
  schedule:
    - cron: '17 6 * * 1'  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-client-smoke:
    # Skip fork PRs: the canary installs unpinned upstream clients, which is
    # deliberate on trusted refs but an unnecessary supply-chain surface (and
    # runner cost) for untrusted forks. Fork PRs still get the pinned,
    # read-only `validate` required check.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.1 — pinned to immutable SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        # actions/setup-node@v7.0.0 — pinned to immutable SHA.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install latest Codex, Claude Code, and Gemini CLI
        # Deliberately unpinned: this canary detects breaking changes in the
        # newest published clients before users encounter them.
        run: npm install --global @openai/codex@latest @anthropic-ai/claude-code@latest @google/gemini-cli@latest

      - name: Install latest Antigravity CLI
        # The binary version floats (the bootstrap resolves the latest
        # release and verifies its SHA-512), preserving the canary. Only the
        # bootstrap script itself is pinned by hash so CI never executes
        # unreviewed shell fetched over the network.
        env:
          # Reviewed 2026-10-01 (DRC-4762): the only change from ee1ea43c picks an
          # Android build when `uname -o` is Android; Linux runners are unaffected.
          AGY_INSTALLER_SHA256: 62966c07365423bd4dc209355060744058fb30d60f5323e2d360e39de64e5042
        run: |
          set -euo pipefail
          # Hash the decoded script; the upstream endpoint also serves gzip.
          curl --compressed -fsSL https://antigravity.google/cli/install.sh -o "$RUNNER_TEMP/install-agy.sh"
          echo "${AGY_INSTALLER_SHA256}  $RUNNER_TEMP/install-agy.sh" | sha256sum --check - || {
            echo "::error::antigravity.google/cli/install.sh changed upstream." \
              "Review the new script, then update AGY_INSTALLER_SHA256 in this workflow." \
              "New hash: $(sha256sum "$RUNNER_TEMP/install-agy.sh" | cut -d' ' -f1)"
            exit 1
          }
          bash "$RUNNER_TEMP/install-agy.sh" --dir "$RUNNER_TEMP/agy-bin"
          echo "$RUNNER_TEMP/agy-bin" >> "$GITHUB_PATH"

      - name: Record tested client versions
        run: |
          codex --version
          claude --version
          gemini --version
          agy --version

      - name: Strictly validate the Claude Code package
        run: |
          set -euo pipefail
          # Only the plugin. The repository root is no longer a Claude
          # marketplace — compass is listed in spacedock-dev/marketplace — so
          # `validate .` here would fail on a missing manifest.
          claude plugin validate ./compass --strict

      - name: Install and inspect the plugin with Codex
        run: |
          set -euo pipefail
          codex plugin marketplace add "$GITHUB_WORKSPACE"
          codex plugin add compass@compass-marketplace --json | tee /tmp/compass-install.json
          codex plugin list | tee /tmp/compass-codex-plugins.txt
          grep -F 'compass@compass-marketplace' /tmp/compass-codex-plugins.txt

          INSTALL_PATH=$(jq -er '.installedPath' /tmp/compass-install.json)
          EXPECTED_SKILLS=$(find compass/skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)
          ACTUAL_SKILLS=$(find "$INSTALL_PATH/skills" -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)
          test "$ACTUAL_SKILLS" -eq "$EXPECTED_SKILLS"
          test -f "$INSTALL_PATH/skills/compass/SKILL.md"
          test -f "$INSTALL_PATH/skills/compass/agents/openai.yaml"
          test -f "$INSTALL_PATH/skills/compass/server.py"

          # The later steps validate and launch THIS copy, not the checkout.
          echo "COMPASS_INSTALL_PATH=$INSTALL_PATH" >> "$GITHUB_ENV"

      - name: Validate and install the plugin with Antigravity CLI
        run: |
          set -euo pipefail
          agy plugin validate ./compass | tee /tmp/compass-agy.txt
          # Anchor on the success shape; a plain substring grep also matches AGY's
          # "skipped (not found)" failure output. Older AGY printed "skills : N processed"
          # and the current one prints a summary line, "skills N · agents 0 · ...".
          SKILLS=$(find compass/skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l | tr -d ' ')
          grep -E "skills[[:space:]]+(: ${SKILLS} processed|${SKILLS} ·)" /tmp/compass-agy.txt

          # Isolated HOME so the runner's real AGY state is never touched.
          export HOME="$RUNNER_TEMP/agy-home"
          mkdir -p "$HOME"
          agy plugin install "$GITHUB_WORKSPACE/compass"
          # `agy plugin list` printed JSON up to 1.3.3 and plain text from 1.3.4, so ask for JSON.
          # 1.3.3 answers `--json` in its old shape ({"imports": [{"components": [...]}]}) and
          # 1.3.4 answers with an array ([{"skills": [...]}]); the filters read either, so the
          # canary keeps checking that the plugin and its skill installed rather than the format.
          agy plugin list --json | tee /tmp/compass-agy-plugins.txt
          LISTED='(if type == "array" then . else .imports end)'
          jq -e "${LISTED} | map(.name) | index(\"compass\") != null" /tmp/compass-agy-plugins.txt
          jq -e "${LISTED}[] | select(.name == \"compass\") | ((.skills // []) | length > 0) or ((.components // []) | index(\"skills\") != null)" /tmp/compass-agy-plugins.txt

      - name: Install the extension with Gemini CLI
        env:
          # Official headless-mode switch: trust only for this isolated CI step.
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        run: |
          set -euo pipefail
          # compass-gemini, not compass: both Claude Code and Gemini CLI load
          # extension hooks from <root>/hooks/hooks.json and neither lets that
          # path move, so Gemini has its own root. Installing the plugin root
          # instead would hand Gemini Claude's event vocabulary, which is the
          # defect this split fixed.
          gemini extensions install "$GITHUB_WORKSPACE/compass-gemini" --consent
          cd "$RUNNER_TEMP"
          # Strip ANSI color codes so the anchors below are stable, and
          # anchor on the "✓ name (version)" loaded marker — a bare name
          # grep is satisfied by the checkout path in "Source:" lines.
          gemini extensions list 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee /tmp/compass-gemini-extensions.txt
          grep -E '^✓ compass \([0-9]+\.[0-9]+\.[0-9]+\)' /tmp/compass-gemini-extensions.txt
          grep -F 'Enabled (User): true' /tmp/compass-gemini-extensions.txt
          # The hooks Gemini loaded must be Gemini's own vocabulary. A foreign
          # event name is skipped with a warning on every session, which is
          # exactly what shipped before the roots were split.
          HOOKS="$GITHUB_WORKSPACE/compass-gemini/hooks/hooks.json"
          jq -e '.hooks | has("BeforeAgent") and has("AfterAgent") and has("AfterTool")' "$HOOKS"
          jq -e '.hooks | has("UserPromptSubmit") | not' "$HOOKS"
          jq -e '[.hooks[][] | .hooks[].command] | all(contains("gemini"))' "$HOOKS"

      - name: Check the installed runtime inventory
        # Separate from the launch below so a missing file produces the
        # validator's precise per-path diagnostic instead of a server that
        # simply fails to start. The inventory lives in
        # scripts/validate_plugins.py and is deliberately not repeated here:
        # two copies of a required-file list is how one of them goes stale.
        run: |
          set -euo pipefail
          python3 -m pip install --quiet -r requirements-validation.txt
          python3 scripts/validate_plugins.py --runtime-files "$COMPASS_INSTALL_PATH"

      - name: Smoke test the installed dashboard end to end
        # The installed copy, from an unrelated directory, with the repository
        # off sys.path: the only arrangement that proves an install works
        # without the checkout it was built from.
        run: |
          set -euo pipefail
          STATE_DIR="$RUNNER_TEMP/compass-smoke"
          mkdir -p "$STATE_DIR"
          LAUNCHER="$COMPASS_INSTALL_PATH/skills/compass/server.py"
          test -f "$LAUNCHER"

          # A free port chosen by the kernel, so a parallel job cannot collide.
          PORT=$(python3 -c "import socket; s = socket.socket(); s.bind(('127.0.0.1', 0)); port = s.getsockname()[1]; s.close(); print(port)")

          unset PYTHONPATH
          export PYTHONNOUSERSITE=1
          export COMPASS_HOME="$STATE_DIR"
          SERVER_PID=""

          cleanup() {
            # Only this state directory and this captured pid. Killing by
            # process name could take out an unrelated python on the runner.
            python3 "$LAUNCHER" --port "$PORT" --stop >/dev/null 2>&1 || true
            if [ -n "$SERVER_PID" ] && kill -0 "$SERVER_PID" 2>/dev/null; then
              kill "$SERVER_PID" 2>/dev/null || true
              for _ in $(seq 1 20); do
                kill -0 "$SERVER_PID" 2>/dev/null || break
                sleep 0.5
              done
              kill -9 "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
            fi
            python3 -c "import socket, sys; s = socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); s.bind(('127.0.0.1', int(sys.argv[1]))); s.close()" "$PORT"
          }
          trap cleanup EXIT

          # An unrelated working directory: nothing may resolve through ".".
          cd "$RUNNER_TEMP"
          python3 "$LAUNCHER" --port "$PORT" &
          SERVER_PID=$!

          for _ in $(seq 1 20); do
            curl -sf "http://127.0.0.1:$PORT/api/health" > /tmp/compass-health.json && break
            sleep 0.5
          done
          # The pid ties the answer to the process this step started, rather
          # than to whatever else might be listening.
          jq -e --argjson pid "$SERVER_PID" '.ok == true and .pid == $pid' /tmp/compass-health.json
          curl -sf "http://127.0.0.1:$PORT/api/data" > /tmp/compass-api.json
          jq -e '.harnesses | type == "array"' /tmp/compass-api.json
          curl -sf "http://127.0.0.1:$PORT/" | grep -F '<title>Compass</title>'

          # --stop is the documented way to end it, and has to work against the
          # installed copy too. The trap still runs afterwards as a backstop.
          python3 "$LAUNCHER" --port "$PORT" --stop
