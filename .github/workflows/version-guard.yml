name: Version Guard

# Version fields are owned by the tag-driven Release workflow: pushing a
# semver tag on main bumps every manifest in one release commit. Ordinary
# PRs therefore must never change a version field — there is no label
# escape hatch. Adapted (and simplified for a single plugin) from
# DataRecce/recce-team.
#
# What it compares — the PR HEAD vs merge-base(PR base branch, HEAD) — failing
# on any change to:
#   - compass/.claude-plugin/plugin.json  .version
#   - compass/.codex-plugin/plugin.json   .version
#   - compass-gemini/gemini-extension.json .version
#
# compass is listed in spacedock-dev/marketplace rather than a marketplace of
# its own, so there is no repository-level marketplace version left to watch.
#
# Why merge-base and an explicit head checkout, not the default merge ref:
# the merge ref is rebuilt against the CURRENT base tip, so a release commit
# landing on main mid-PR would read as a "version change" on a PR that never
# touched version files. Comparing the PR head against its merge-base with
# the base branch attributes only the PR's own changes.
#
# Why no `paths:` filter either: it is a required check, and a required check
# that a filter excludes never reports at all — branch protection reads a
# missing context as pending, not passing, so the PR blocks forever. The job
# also costs about five seconds, so there is nothing to win. See AGENTS.md,
# Calibrating Effort.
#
# Why no `branches:` filter: a stacked PR targets the branch of the layer
# below it, not main, but `gh stack merge` lands the whole stack on main in
# one atomic operation, so main's ruleset requires this check on EVERY layer.
# With a base filter the workflow never fired on those PRs, the required
# `version-guard` context never reported, and the stack sat blocked forever.
# Running on every base keeps each layer honest against its own parent: a bump
# anywhere in a stack still fails at the layer that introduced it.
#
# On a merge queue entry (`merge_group`) there is no pull request: the entry's
# head is compared against its merge base with the branch it lands on
# (`merge_group.base_ref`), so a bump in any pull request queued ahead of it
# fails the entry too. Not `merge_group.base_sha`: the queue builds an entry on
# the head of the entry ahead of it, so that SHA would check this PR alone.
# The concurrency group falls back to the entry's ref, unique per entry, so
# queue entries never cancel each other; a pull request keeps its number.
#
# Deliberately exempt: files that don't exist at the
# merge-base (initial add), and pushes to any branch (the release commit lands
# directly on main via the Actions ruleset bypass, never through a PR).
#
# Security model:
#   - Read-only: `permissions: contents: read`; `pull_request` (not _target),
#     so fork PRs get a read-only token and no secrets.
#   - actions/checkout pinned to an immutable SHA.
#   - Repo-controlled JSON values are compared as quoted shell strings and
#     passed to jq via --arg only, and newline-collapsed before they reach
#     `::error::` annotation lines, so a crafted value cannot emit its own
#     workflow commands.

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: version-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  version-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EVENT: ${{ github.event_name }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
    steps:
      - name: Checkout PR head
        # actions/checkout@v7.0.1 — pinned to immutable SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # The PR head itself — NOT the default merge ref (see header).
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0

      - name: Planted failure for the re-queue live check (never merge)
        if: github.event_name == 'merge_group'
        run: |
          echo "::error::Planted merge_group failure to exercise requeue-after-ejection.yml. This PR must not merge."
          exit 1

      - name: Check version fields against merge-base
        run: |
          set -euo pipefail
          FAIL=0

          if [ "$EVENT" = "merge_group" ]; then
            BRANCH="${GROUP_BASE_REF#refs/heads/}"
            BASE="origin/${BRANCH:-?}"
          else
            BASE="origin/$GITHUB_BASE_REF"
          fi
          if ! MERGE_BASE=$(git merge-base "$BASE" "$HEAD_SHA"); then
            echo "::error::cannot compute merge-base of $BASE and $HEAD_SHA — cannot compare version fields"
            exit 1
          fi
          echo "Comparing HEAD ($HEAD_SHA) against merge-base ($MERGE_BASE)"

          # Compare one jq-extracted field between the merge-base blob and
          # the checked-out head file. Skips silently when the file is absent
          # on either side or the field is absent at the merge-base.
          check_field() {
            local file="$1" jqpath="$2" label="$3"
            local base_v head_v
            if ! git cat-file -e "$MERGE_BASE:$file" 2>/dev/null || [ ! -f "$file" ]; then
              return 0
            fi
            base_v=$(git show "$MERGE_BASE:$file" | jq -r "$jqpath // empty")
            head_v=$(jq -r "$jqpath // empty" "$file")
            base_v=${base_v//$'\n'/ }
            head_v=${head_v//$'\n'/ }
            if [ -n "$base_v" ] && [ "$base_v" != "$head_v" ]; then
              echo "::error file=$file::$label changed ($base_v -> $head_v). Version fields are owned by the tag-driven Release workflow — revert this bump and release by tagging main instead. See CONTRIBUTING.md 'Releases'."
              FAIL=1
            fi
          }

          check_field "compass/.claude-plugin/plugin.json" '.version' "plugin manifest version"
          check_field "compass/.codex-plugin/plugin.json" '.version' "codex manifest version"
          check_field "compass-gemini/gemini-extension.json" '.version' "Gemini CLI extension version"

          if [ "$FAIL" = "1" ]; then
            echo
            echo "Version bumps happen at release time: push a strictly-greater semver"
            echo "tag on main and the Release workflow writes the bump commit."
            exit 1
          fi
          echo "Version field policy satisfied."
