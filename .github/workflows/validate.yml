name: Validate

# DELIBERATELY UNFILTERED. `scripts/validate_plugins.py` resolves every
# relative Markdown link and heading anchor across the owned docs, so a
# prose-only change is exactly the change it exists to catch. It is also a
# required check, and a required check with a `paths:` filter never reports on
# a PR that misses the filter — branch protection reads that as pending
# forever, so the PR can never merge. See AGENTS.md, Calibrating Effort.
# Only the dashboard suite at the end is conditional, and only on whether the
# quality gate already runs it.
on:
  push:
    branches: [main]
  pull_request:
  # A merge queue entry: this is a required check, so it must report there too.
  merge_group:

# Read-only, like every other workflow here. Without this the job got the repository's default
# token, which can be write, beside the third-party code it installs and runs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `claude plugin validate --strict` and `agy plugin validate` are part of the
# documented pre-PR suite (see AGENTS.md) but run locally only — those CLIs
# are not available on stock runners. scripts/validate_plugins.py is the
# load-bearing contract gate here.
jobs:
  validate:
    runs-on: ubuntu-latest
    # The only job in the repository that had no timeout, so it inherited
    # GitHub's 360-minute default. Its longest step is the same `unittest
    # discover` that AGENTS.md records hanging on subprocess and socket waits
    # under load, and this is a required check — a hang would hold the PR
    # pending for six hours rather than failing in ten minutes.
    timeout-minutes: 10
    steps:
      # actions/checkout@v7.0.1 — pinned to immutable SHA (this is the
      # required check; mutable major tags don't belong here).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The scope step below diffs the PR against its merge base.
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-python@v7.0.0 — pinned to immutable SHA.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        # The release job's own install, on its Python, so a hash that no longer matches the pin
        # fails here on the pull request that made it rather than at the next release, with the
        # deploy key already on disk.
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r requirements-release.txt
      - name: Validate plugin contracts
        run: python3 scripts/validate_plugins.py
      - name: Run validator unit tests
        run: python3 -m unittest scripts/tests/test_validate_plugins.py
      - name: Run release bump-script unit tests
        run: python3 -m unittest scripts/tests/test_bump_version.py
      - name: Check version-field parity across all owned locations
        run: python3 scripts/bump_version.py --current
      # The same lanes quality-gate.yml uses, from the same script.
      - name: Ask whether the quality gate runs the Python suites
        id: scope
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: python3 scripts/ci_scope.py
      # The backstop for a PR the quality gate runs no Python suite on, which is
      # a prose-only one. Then this is the only run, and deleting it would let a
      # prose edit that breaks a test merge green. Measured on
      # `docs/captures/README.md`, once prose to the detector and still read by
      # test_documentation.py: one stranded table row gave the validator exit 0
      # and this suite red. When the gate runs the suites (three times, on
      # Python and frontend changes alike) this copy only repeated them, so it
      # skips. A failed or missing answer is not `true`, so it fails open.
      - name: Run dashboard tests
        if: steps.scope.outputs.python_suites != 'true'
        run: python3 scripts/run_tests.py -s compass/skills/compass/tests -t .
