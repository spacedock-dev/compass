name: Semgrep SAST

# Weekly security scan; dependency audits also run on dependency pull requests.
# Python advisories are queried as data without installing an audit tool.
#
# Everything the scan runs is pinned. The image is a release tag held to its
# multi-arch index digest. The rules are the semgrep-rules repository at one
# commit, never a registry name: `--config auto` and `p/...` rulesets are
# fetched from the Semgrep registry at run time and change without a commit
# here (and `auto` also needs metrics on). `--metrics=off` sends nothing home.
# Bumps are deliberate edits to a tag and commit at least two weeks old.
#
# The rule set is each language's `security` rules, without the low-confidence
# `audit` subfolders: Python, JavaScript (with its browser rules), Bash and the
# GitHub Actions rules for the workflows themselves.

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC
  workflow_dispatch: {}
  pull_request:
    paths:
      - pnpm-lock.yaml
      - package.json
      - pnpm-workspace.yaml
      - tools/pnpm-bootstrap/package-lock.json
      - tools/pnpm-bootstrap/package.json
      - requirements-*.txt
      - requirements-*.in
      - .github/dependabot.yml
      - .github/workflows/**
      - .github/actions/**
      - scripts/audit_python_dependencies.py
      - scripts/check_dependency_age.py

permissions:
  contents: read

jobs:
  semgrep:
    if: github.event_name != 'pull_request'
    name: Semgrep Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # semgrep/semgrep 1.183.0 (pushed 2026-10-29), its OCI image index digest.
      image: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
    steps:
      # actions/checkout@v7.0.1 — pinned to immutable SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # semgrep/semgrep-rules at its develop head of 2026-10-21.
      - name: Check out the pinned rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: semgrep/semgrep-rules
          ref: 16b9e6d45f10649f6a531ec4838ed9924372c3bc
          path: semgrep-rules
          persist-credentials: false
      - name: Run Semgrep
        run: |
          set -eu
          # One --config per rule file: a directory would also load the YAML
          # test targets beside the rules.
          configs=$(find semgrep-rules/python/lang/security \
            semgrep-rules/javascript/lang/security \
            semgrep-rules/javascript/browser/security \
            semgrep-rules/bash/lang/security \
            semgrep-rules/yaml/github-actions/security \
            -name '*.yaml' ! -path '*/audit/*' ! -name '*.test.yaml' | sort | sed 's/^/--config /')
          test -n "$configs"
          # Frontend *.test.* files (including test helpers) parse test-only DOM fixtures
          # and recorded legacy HTML in isolated jsdom documents. Production modules,
          # browser proofs and Storybook remain scanned; no security rule is disabled.
          # The default five-second rule timeout truncates taint analysis in project_context.py.
          # Sixty seconds completes that module in the pinned image, including on two local cores.
          # shellcheck disable=SC2086 # one word per --config and path
          semgrep scan \
            --metrics=off \
            --disable-version-check \
            --timeout 60 \
            $configs \
            --exclude semgrep-rules \
            --exclude 'frontend/src/**/*.test.*' \
            --error \
            --severity WARNING \
            --severity ERROR

  npm-audit:
    name: Audit npm dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COREPACK_ENABLE_NETWORK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the locked pnpm binary
        shell: bash
        timeout-minutes: 3
        run: |
          npm ci --ignore-scripts --prefix tools/pnpm-bootstrap
          echo "$GITHUB_WORKSPACE/tools/pnpm-bootstrap/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Audit the project lockfile without changing it
        timeout-minutes: 3
        run: pnpm audit --audit-level=high
      - name: Audit the bootstrap lockfile without changing it
        timeout-minutes: 3
        working-directory: tools/pnpm-bootstrap
        run: npm audit --audit-level=high

  python-audit:
    name: Audit Python pins and bot pin age
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Ubuntu's system Python suffices: both checks use only the standard library.
      - name: Refuse bot pins younger than fourteen days, including security updates
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        timeout-minutes: 3
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_dependency_age.py
      - name: Check every Python requirement against OSV
        timeout-minutes: 3
        run: python3 scripts/audit_python_dependencies.py
